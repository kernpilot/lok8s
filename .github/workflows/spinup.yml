# Spin up & register a cluster from CI.
#
# Reusable workflow (workflow_call) + manual trigger (workflow_dispatch) that
# provisions a committed cluster from your repo with `lo` and — when the cluster
# opts into kubehz visibility (spec.kubehz.access != none) — registers it via the
# claim-key flow: a dedicated SSH key 'kubehz-claim-<domain>' is planted in your
# Hetzner Cloud project, and its fingerprint (the claim ticket) is deliberately
# kept OUT of logs and the job summary — you read it from your own Hetzner
# console to claim the cluster from the dashboard.
#
# It needs exactly ONE secret: HCLOUD_TOKEN (your Hetzner Cloud API token, used by
# `lo`/the provider to create the infrastructure). No platform/API token is
# required — ownership is proven later, interactively, when you claim the cluster.
#
# Usage (as a reusable workflow from another repo):
#
#   jobs:
#     spinup:
#       uses: kernpilot/lok8s/.github/workflows/spinup.yml@main
#       with:
#         domain: my-cluster.example.com
#       secrets:
#         HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
#
# The cluster.lok8s.yaml for `domain` must already be committed under
# `clusters/<domain>/` in the calling repo.

name: Spin up & register cluster

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Cluster domain to provision (must be committed under clusters/<domain>/)'
        required: true
        type: string
  workflow_call:
    inputs:
      domain:
        description: 'Cluster domain to provision'
        required: true
        type: string
    secrets:
      HCLOUD_TOKEN:
        description: 'Hetzner Cloud API token used to create the infrastructure.'
        required: true

permissions:
  contents: read

jobs:
  spinup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install `b` (the binary/env manager). Supply-chain rule: never pipe a
      # remote script straight into a shell — download to a file, pin the ref,
      # then execute it. The exact binary versions are pinned by the committed
      # .bin/b.yaml + .bin/b.lock that `b install` consumes.
      - name: Install b
        run: |
          curl -fsSL https://raw.githubusercontent.com/fentas/b/v4.17.2/install.sh -o /tmp/b-install.sh
          B_INSTALL_DIR="${HOME}/.local/bin" bash /tmp/b-install.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install pinned dependencies
        env:
          # b resolves binary sources from GitHub; a token avoids API rate limits
          # and 0-byte downloads. GITHUB_TOKEN is the repo-scoped automatic token.
          GITHUB_TOKEN: ${{ github.token }}
        run: b install

      # Provision the cluster. For a self-hosted cluster with kubehz visibility,
      # `lo provision` registers a PENDING cluster via the claim-key flow (the
      # workflow always has HCLOUD_TOKEN): the fingerprint of the planted
      # 'kubehz-claim-<domain>' key is the claim ticket and is deliberately NOT
      # printed — a CI log/summary is no place for a claim secret. We only
      # detect THAT registration happened, to emit the pointer below.
      - name: Provision & register
        id: provision
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -o pipefail
          lo provision "${DOMAIN}" 2>&1 | tee /tmp/provision.log

          # register_cluster prints "registered (pending)" on success. Detect it
          # (best-effort; absent for non-kubehz / access:none clusters).
          registered=false
          if grep -q "registered (pending)" /tmp/provision.log; then
            registered=true
          fi
          echo "registered=${registered}" >> "${GITHUB_OUTPUT}"

      # Point at the claim ticket WITHOUT printing it: the fingerprint of the
      # kubehz-claim key lives only in the user's Hetzner Cloud project, which
      # is exactly what makes pasting it at /claim an ownership proof.
      - name: Claim instructions
        if: always() && steps.provision.outputs.registered == 'true'
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          {
            echo "## Cluster registered — claim it to take ownership"
            echo ""
            echo "Your cluster \`${DOMAIN}\` is registered with kubehz as **pending**,"
            echo "and lok8s planted a dedicated claim key \`kubehz-claim-${DOMAIN}\` in your"
            echo "Hetzner Cloud project. Its fingerprint is your **claim ticket** — treat it"
            echo "like a password; it is deliberately not printed here."
            echo ""
            echo "1. Open your Hetzner Cloud console → **Security → SSH keys** and copy the"
            echo "   fingerprint of \`kubehz-claim-${DOMAIN}\` (or run \`hcloud ssh-key list\`)."
            echo "2. Paste it on the kubehz dashboard **Claim** page."
            echo ""
            echo "The ticket is one-time use; after a successful claim you may delete the"
            echo "\`kubehz-claim-${DOMAIN}\` SSH key from your Hetzner project."
          } >> "${GITHUB_STEP_SUMMARY}"
