# Spin up & register a cluster from CI.
#
# Reusable workflow (workflow_call) + manual trigger (workflow_dispatch) that
# provisions a committed cluster from your repo with `lo`. When the cluster
# opts into kubehz visibility (spec.kubehz.access != none), `lo provision`
# registers it as pending and uploads a claim key to your Hetzner Cloud
# project. The MD5 fingerprint of that key is a one-time claim ticket: any
# signed-in kubehz user who has it can claim the cluster. A public repo shows
# its job logs and summaries to everyone, so this workflow hides the ticket in
# the log, and no step output, env value or job summary holds it.
#
# Do not claim with that ticket. The runner does not keep the bind secret
# (clusters/<domain>/.kubehz-bind), so the agent that you deploy later
# registers the cluster again, and a registration claimed with the ticket of
# the run gets no heartbeat. The job summary gives the steps: deploy the
# agent (`lo kubehz deploy`), then claim with `lo kubehz claim-code`.
#
# It needs exactly ONE secret: HCLOUD_TOKEN (your Hetzner Cloud API token, used by
# `lo`/the provider to create the infrastructure and to upload the claim key).
# No platform/API token is required: you prove ownership later, when you claim
# the cluster with the claim code of its agent while signed in to the dashboard.
#
# Usage (as a reusable workflow from another repo):
#
#   jobs:
#     spinup:
#       uses: kernpilot/lok8s/.github/workflows/spinup.yml@main
#       with:
#         domain: my-cluster.example.com
#       secrets:
#         HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
#
# The cluster.lok8s.yaml for `domain` must already be committed under
# `clusters/<domain>/` in the calling repo.

name: Spin up & register cluster

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Cluster domain to provision (must be committed under clusters/<domain>/)'
        required: true
        type: string
  workflow_call:
    inputs:
      domain:
        description: 'Cluster domain to provision'
        required: true
        type: string
    secrets:
      HCLOUD_TOKEN:
        description: 'Hetzner Cloud API token used to create the infrastructure.'
        required: true

permissions:
  contents: read

jobs:
  spinup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install `b` (the binary/env manager). Supply-chain rule: never pipe a
      # remote script straight into a shell — download to a file, pin the ref,
      # then execute it. The exact binary versions are pinned by the committed
      # .bin/b.yaml + .bin/b.lock that `b install` consumes.
      - name: Install b
        run: |
          # Pin the BINARY, not just the installer script. install.sh resolves
          # `releases/latest` with an UNAUTHENTICATED curl (it takes no token), so
          # on a rate-limited Actions runner IP the reply carries no "tag_name",
          # LATEST comes back empty and it exits "Failed to determine latest
          # version". That is how E2E broke on 2026-08-07 while it sat skipped
          # behind a red gate, having passed on 2026-08-01 with this same pinned
          # URL. Pinning removes the API call; the checksum makes the download
          # verifiable, which resolving "latest" never was.
          B_VERSION=4.18.8
          curl -fsSL "https://github.com/fentas/b/releases/download/v${B_VERSION}/b-linux-amd64.tar.gz" -o /tmp/b.tar.gz
          echo "297e07f301060480a78380afae066b3c0013c572d704862e2b2f2a4477540aad  /tmp/b.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/b.tar.gz -C "${HOME}/.local/bin" b
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install pinned dependencies
        env:
          # b resolves binary sources from GitHub; a token avoids API rate limits
          # and 0-byte downloads. GITHUB_TOKEN is the repo-scoped automatic token.
          GITHUB_TOKEN: ${{ github.token }}
        run: b install

      # Provision the cluster. For a self-hosted cluster with kubehz visibility,
      # `lo provision` registers a PENDING cluster. With the claim key, lo
      # prints the one-time claim ticket on two lines: the curl hint and the
      # "fingerprint:" line. hide_claim_ticket hides the ticket before tee, so
      # it reaches neither the job log nor /tmp/provision.log: on these two
      # lines by their exact format, and on every line by the shape of an MD5
      # fingerprint. A ::add-mask:: cannot do this: GitHub masks a value
      # only after the mask command, and lo prints the ticket in the same
      # stream that brings it. The function is inline because a reusable
      # workflow runs in the checkout of the calling repo, where no lok8s
      # script exists. provision.yml has the same function. A Go test and a
      # bats test run it on the register output of both implementations of lo
      # (internal/kubehz/claim_ticket_workflow_test.go,
      # tests/unit/kubehz_register_test.bats).
      - name: Provision & register
        id: provision
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -o pipefail
          # is_name <rule> <value>: the value matches the regex rule, as bytes.
          is_name() {
            local LC_ALL=C
            [[ "${2}" =~ ${1} ]]
          }
          # The domain must match the domain rule of lo, so that no other text
          # reaches the command line, the log or the summary.
          domain_rule='^[A-Za-z0-9][A-Za-z0-9._-]*$'
          if ! is_name "${domain_rule}" "${DOMAIN}"; then
            echo "::error::The domain input does not match the lo domain rule ${domain_rule}. lo did not run."
            exit 1
          fi
          # hide_claim_ticket: copy stdin to stdout line by line, and hide the
          # claim ticket. On each line, two steps:
          # 1. The two register lines that carry the ticket (the curl hint and
          #    the "fingerprint:" line) get the placeholder in place of the
          #    value, whatever its shape. The match is exact, without the CR
          #    of a CRLF line end; the CR stays.
          # 2. Every string with the shape of an MD5 fingerprint (16 or more
          #    pairs of hex digits, with a colon between each two) gets the
          #    placeholder. A longer run of such pairs is hidden whole. So a
          #    ticket in another line format is hidden too, and so is the
          #    public server-key fingerprint of the legacy registration.
          #    "lo:<domain>" stays.
          # Every other text stays as lo printed it. LC_ALL=C: the match
          # compares bytes. The function is for text: bash read drops a NUL
          # byte, and a line stays in memory until its newline comes. Each
          # line goes out when it comes in, so the log streams.
          # Limit: the function hides a ticket that is on one line, as lo
          # prints it today. A ticket split over two lines (a newline or a CR
          # in it), or in another encoding, passes.
          hide_claim_ticket() {
            local LC_ALL=C line eol cr out
            local hidden='<hidden: one-time claim ticket>'
            local curl_head="       -H 'Content-Type: application/json' -d '{\"fingerprint\":\""
            local curl_tail="\"}'"
            local fp_head='  fingerprint: '
            local fp_tail='   (also visible in Hetzner Console -> Security -> SSH keys)'
            local md5='[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){15,}'
            while :; do
              eol=$'\n'
              if ! IFS= read -r line; then
                [[ -n "${line}" ]] || break
                eol=""
              fi
              cr=""
              if [[ "${line}" == *$'\r' ]]; then
                cr=$'\r'
                line="${line%$'\r'}"
              fi
              if [[ "${line}" == "${curl_head}"*"${curl_tail}" ]]; then
                line="${curl_head}${hidden}${curl_tail}"
              elif [[ "${line}" == "${fp_head}"*"${fp_tail}" ]]; then
                line="${fp_head}${hidden}${fp_tail}"
              fi
              out=""
              while [[ "${line}" =~ ${md5} ]]; do
                out+="${line%%"${BASH_REMATCH[0]}"*}${hidden}"
                line="${line#*"${BASH_REMATCH[0]}"}"
              done
              printf '%s%s%s%s' "${out}" "${line}" "${cr}" "${eol}"
              [[ -n "${eol}" ]] || break
            done
          }
          rc=0
          lo provision --force --domain "${DOMAIN}" 2>&1 | hide_claim_ticket | tee /tmp/provision.log || rc=$?

          # How lo registered the cluster, for the summary step, also when the
          # provision failed after the registration. Only public values leave
          # this step: the registration mode and the name of the claim key.
          registration="" claim_key=""
          while IFS= read -r line; do
            case "${line}" in
              "kubehz: cluster '"*"' registered (pending). Claim key '"*"' uploaded to your Hetzner Cloud account.")
                name="${line#*"). Claim key '"}"
                name="${name%"' uploaded to your Hetzner Cloud account."}"
                if is_name '^[A-Za-z0-9._-]+$' "${name}"; then
                  registration=claim-key claim_key="${name}"
                fi
                ;;
              "kubehz: cluster '"*"' registered (pending). Claim it in the dashboard:")
                [[ -n "${registration}" ]] || registration=announce
                ;;
            esac
          done < /tmp/provision.log
          {
            echo "registration=${registration}"
            echo "claim_key=${claim_key}"
          } >> "${GITHUB_OUTPUT}"
          exit "${rc}"

      # Write the claim steps to the job summary: deploy the agent, then claim
      # with its claim code. The summary says where the claim ticket can be
      # read (in the Hetzner Cloud project) and why the user must not claim
      # with it. It never holds the ticket, and the Hetzner token is NEVER
      # printed here.
      - name: Claim instructions
        if: always() && steps.provision.outputs.registration != ''
        env:
          DOMAIN: ${{ inputs.domain }}
          REGISTRATION: ${{ steps.provision.outputs.registration }}
          CLAIM_KEY: ${{ steps.provision.outputs.claim_key }}
        run: |
          # is_name <rule> <value>: the value matches the regex rule, as bytes.
          is_name() {
            local LC_ALL=C
            [[ "${2}" =~ ${1} ]]
          }
          # The same domain rule as the step before: no other text reaches the
          # summary.
          domain_rule='^[A-Za-z0-9][A-Za-z0-9._-]*$'
          if ! is_name "${domain_rule}" "${DOMAIN}"; then
            echo "::error::The domain input does not match the lo domain rule ${domain_rule}. No summary was written."
            exit 1
          fi
          {
            echo "## Cluster registered: claim it to take ownership"
            echo ""
            echo "Your cluster \`${DOMAIN}\` is registered with kubehz as **pending**."
            echo ""
            echo "To claim it, deploy the kubehz agent in it with your kubeconfig of the cluster"
            echo "(\`lo kubehz deploy\`), then run \`lo kubehz claim-code\`. Sign in to the kubehz dashboard, open"
            echo "the **Claim** page, pick the **One-time code** tab and paste the code. The agent makes the code"
            echo "on its first run: if \`lo kubehz claim-code\` reports that there is no claim code yet, wait a few"
            echo "minutes and run it again."
            echo ""
            echo "The registration of the agent counts against the limit of five pending registrations per domain."
            echo "At the limit, the agent cannot register, and the dashboard does not find its claim code. The agent"
            echo "tries again on each run, so the claim works after an older registration expires (by default"
            echo "after about 14 days)."
            echo ""
            if [[ "${REGISTRATION}" == claim-key ]]; then
              echo "Do not claim the cluster with the claim ticket of this run. The runner does not keep the bind"
              echo "secret of the registration (\`clusters/${DOMAIN}/.kubehz-bind\`), so the agent registers the"
              echo "cluster again, as a new pending registration. A registration that you claim with the ticket of"
              echo "this run gets no heartbeat, and the dashboard never shows it as connected."
              echo ""
              echo "The claim ticket is the MD5 fingerprint of the SSH key \`${CLAIM_KEY}\`. It is in the Hetzner"
              echo "Console of the project of your \`HCLOUD_TOKEN\`: **Security → SSH keys**, the key \`${CLAIM_KEY}\`."
              echo "People with access to this Hetzner Cloud project can read it there."
              echo ""
              echo "The ticket is a **one-time claim ticket**: any signed-in kubehz user who has it can claim"
              echo "this registration. So this workflow does not show it: the log has a placeholder in its place,"
              echo "and this summary does not hold it. Keep it private: do not paste it into an issue, a chat or a CI log."
              echo ""
              echo "Each run that registers a claim key with success adds a new pending registration with its own"
              echo "ticket, and lo replaces the claim key in Hetzner with the key of that run. At registration, the"
              echo "platform refuses a new pending registration when the domain already has five."
              echo "The tickets of earlier runs keep working until someone claims them, or until the cleanup removes"
              echo "their registration: by default when it is older than about 14 days and has had no heartbeat for"
              echo "that time. The cleanup is a policy of the kubehz deployment and can run late. It is not a promised"
              echo "time at which a ticket stops working."
            else
              echo "This run did not confirm a claim-key upload, so lo used the legacy registration and printed"
              echo "no claim ticket. That does not mean that no ticket exists: the platform can make one before"
              echo "the upload fails, and the tickets of earlier runs stay."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
