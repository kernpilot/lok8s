name: Release

# Tag-triggered. goreleaser (.goreleaser.yaml) builds the `lo` binary, the
# kustomize-secret-* exec plugin, lochat, the framework tarball, attaches
# install/lo-install.sh, and publishes checksums.txt for all of them.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # goreleaser derives the version and the changelog from tags.
          fetch-depth: 0

      # The root module (go 1.25.x) also builds the kustomize (1.25) and
      # lochat (1.22) modules; goreleaser runs `go build` in each `dir`.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
