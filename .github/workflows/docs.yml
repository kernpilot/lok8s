name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: yarn

      - name: Install deps
        run: yarn install --frozen-lockfile

      # Machine-readable addon index, served at /addons-index.json (docs/public/
      # is copied verbatim into the site root by VitePress). The kubehz platform
      # polls it to compute ClusterInventory availableUpdates — no git access
      # needed. yq + jq are preinstalled on ubuntu-24.04 runners.
      - name: Build addons index (served at /addons-index.json)
        run: |
          bash docs/.vitepress/build-addons-index.sh > docs/public/addons-index.json
          jq -e '.generatedAt and (.addons | length > 0)' docs/public/addons-index.json

      - name: Build docs
        run: yarn docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url || steps.deployment-final.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub Pages intermittently fails deployments server-side within
      # seconds ("Deployment failed, try again later.", API status
      # `deployment_failed`, no diagnostics). Re-deploying the identical
      # artifact reliably succeeds (proven repeatedly via workflow_dispatch
      # re-runs of the exact sha that had just failed), so the failure is a
      # transient backend condition, not content/config — DNS, cert, and the
      # lok8s.io custom domain all check out. deploy-pages@v4 does not retry
      # a hard `deployment_failed`, hence the manual retry chain below.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        continue-on-error: true

      - name: Wait before retry (transient Pages backend failure)
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        continue-on-error: true

      - name: Wait before final retry
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: sleep 180

      - name: Deploy to GitHub Pages (final retry)
        id: deployment-final
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
