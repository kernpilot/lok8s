name: CI

on:
  push:
    branches: [main]
  pull_request:
    # feat/**: long-lived integration branches (the Go migration lives on
    # feat/go-single-binary) take PRs of their own. Without this entry those
    # PRs ran no CI at all and "run it locally" was the only gate.
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint shell (shellcheck + argsh-lint)
        # `argsh lint` = full shellcheck (with .shellcheckrc: SC2250 braces +
        # repo suppressions) + argsh-lint idiom checks. Runs the pinned
        # ghcr.io/arg-sh/argsh container (shellcheck 0.11.0 inside), via the
        # vendored .bin/argsh — no toolchain install needed. File discovery
        # is shared with `npm run lint`; see hack/lint-shell.sh.
        run: bash hack/lint-shell.sh

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: '.lok8s/ operator/ .github/'
          config_data: |
            extends: default
            ignore: |
              **/chart/templates/
            rules:
              line-length:
                max: 200
              truthy:
                check-keys: false
              document-start: disable

  unit-tests:
    name: Bats Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain (b → argsh, yq)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y gettext-base
          # Pin the BINARY, not just the installer script. install.sh resolves
          # `releases/latest` with an UNAUTHENTICATED curl (it takes no token), so
          # on a rate-limited Actions runner IP the reply carries no "tag_name",
          # LATEST comes back empty and it exits "Failed to determine latest
          # version". That is how E2E broke on 2026-08-07 while it sat skipped
          # behind a red gate, having passed on 2026-08-01 with this same pinned
          # URL. Pinning removes the API call; the checksum makes the download
          # verifiable, which resolving "latest" never was.
          B_VERSION=4.18.6
          curl -fsSL "https://github.com/fentas/b/releases/download/v${B_VERSION}/b-linux-amd64.tar.gz" -o /tmp/b.tar.gz
          echo "096566667b7f788ff1436c7411b1c2204a231bda9ca1d325b7651e4ccd4e7d94  /tmp/b.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/b.tar.gz -C "${HOME}/.local/bin" b
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          b install
          ./.bin/argsh builtins install   # argsh.so — bats runtime + builtins

      - name: Vendored argsh runtime is in sync with the lockfile
        run: |
          # `b install` just rewrote .bin/argsh from b.lock; if that differs
          # from the committed copy, the vendored bootstrap runtime is stale.
          git diff --exit-code -- .bin/argsh \
            || { echo "::error::.bin/argsh drifted from .bin/b.lock — run 'b install' and commit the result"; exit 1; }

      - name: Run unit tests
        env:
          # `argsh test` docker-forwards to the argsh container (no host bats).
          # PATH_BIN makes it mount .bin — the b-pinned toolchain, incl. the
          # kustomize the render tests need — at /usr/local/sbin (read-only),
          # matching local dev where direnv exports PATH_BIN. Without it the
          # container only has its own tools and `kustomize build` tests 127.
          PATH_BIN: ${{ github.workspace }}/.bin
        run: ./.bin/argsh test tests/unit/

      - name: CRD drift gate (lo crds check)
        # libs/crds calls itself "the CI drift gate" — this is the workflow
        # step that runs it. Fails when any operator/crds/*.yaml (or the
        # .lok8s inventory mirror) is stale against its schema source; the
        # fix is `lo crds generate` + commit. Needs the b-pinned mikefarah
        # yq, which `b install` (above) placed in .bin.
        run: PATH="${GITHUB_WORKSPACE}/.bin:${PATH}" ./.lok8s/lo crds check

  go-tests:
    name: Go Build + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # Two builds from one tree (internal/render): `lo` (core, the default
      # tag set — the render execs the pinned kustomize + plugins) and
      # `lo-full` (-tags inprocess — kustomize API + khelm linked in). Every
      # gate below runs against BOTH.
      - name: Build (core + full)
        run: |
          go build ./...
          go build -tags inprocess ./...

      - name: Vet (core + full)
        run: |
          go vet ./...
          go vet -tags inprocess ./...

      - name: Install toolchain (b → argsh, yq, kustomize, khelm; parity needs the bash lo)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # `argsh builtins install` drops argsh.so into PATH_BIN; without it
          # the .so landed in the workspace root, .lok8s/lo (PATH_BIN=.bin)
          # never found it, and the parity run used the pure-bash argsh —
          # which cannot resolve a middle alias like 'encrypt|enc|e:+', so
          # `lo secrets set --enc` returned rc 2 on the bash side only.
          PATH_BIN: ${{ github.workspace }}/.bin
        run: |
          # Same pinned-b install as the Bats job (see its comment for why the
          # binary is pinned rather than resolved via releases/latest).
          # Runs BEFORE the Go tests on purpose: internal/render's byte-parity
          # tests (TestBuildInProcessMatchesPinnedBinary*) compare the
          # in-process render against .bin/kustomize + the .kustomize plugins
          # b installs here. With the install after the tests they skipped
          # silently on every CI run; under CI=true they now FAIL when the
          # toolchain is missing (render_inprocess_test.go: requireToolchain).
          B_VERSION=4.18.6
          curl -fsSL "https://github.com/fentas/b/releases/download/v${B_VERSION}/b-linux-amd64.tar.gz" -o /tmp/b.tar.gz
          echo "096566667b7f788ff1436c7411b1c2204a231bda9ca1d325b7651e4ccd4e7d94  /tmp/b.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/b.tar.gz -C "${HOME}/.local/bin" b
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          b install
          ./.bin/argsh builtins install
          # The secrets.lok8s.dev Secret exec plugin is built from this tree
          # (not a b asset in the contributor profile; what `lo kustomize
          # build` runs): the Secret byte-parity test execs it from
          # .kustomize/ next to khelm.
          make -C kustomize build

      - name: Test (core + full)
        # Includes the tree-drift gate: the cobra command tree must match the
        # argsh usage list in .lok8s/lo while both implementations exist —
        # and the toolchain pin-drift gate (internal/toolchain: pins.go vs
        # go.mod vs the generated .bin/b.yaml). The in-process render tests
        # only run under the tag; core skips them and exercises the exec seam.
        # The toolchain is installed above, so the byte-parity tests run
        # (and fail rather than skip: CI=true is set by Actions).
        run: |
          go test ./...
          go test -tags inprocess ./...

      - name: Test (nested modules — kustomize plugins, lo chat engine)
        # Two more Go modules live in the tree and are NOT reached by the
        # root `./...`: kustomize/ (its own module, also imported by the
        # root via the replace directive) and ai/lochat/ (the lo chat
        # engine). Each runs with its own go.mod under the root toolchain
        # (GOTOOLCHAIN=auto honours a lower `go` directive).
        run: |
          go test -C kustomize ./...
          go test -C ai/lochat ./...

      - name: Lint (core)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # Pinned (verified on GitHub releases); `latest` moved the gate
          # under us once already. Bump deliberately with .golangci.yml.
          version: v2.13.2

      - name: Lint (full)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2
          args: --build-tags inprocess

      - name: Parity (Go lo vs argsh lo) — core and full
        # Differential run of every ported command against both
        # implementations — stdout, stderr, and exit codes must match — for
        # BOTH builds: bin/lo (core: the exec render, the same pinned
        # kustomize + plugins the bash side runs) and bin/lo-full (the
        # in-process render). hack/parity.sh runs all ten harnesses against
        # the binary it is given, prints one summary line per harness (the
        # full log of a failing one) and exits non-zero on any failure.
        env:
          # Same as the install step: the bash side must load the native
          # builtin from .bin/argsh.so, exactly like a developer shell.
          PATH_BIN: ${{ github.workspace }}/.bin
        run: |
          make build
          make build-full
          # Absolute paths: every harness cd's into its synthetic project
          # before invoking the binary, so a relative bin/lo would not resolve.
          for lo in "${PWD}/bin/lo" "${PWD}/bin/lo-full"; do
            echo "::group::parity — ${lo} ($("${lo}" --version))"
            bash hack/parity.sh "${lo}"
            echo "::endgroup::"
          done

      - name: Size gate (bin/lo stays under 36 MiB)
        # sops is the kernpilot age-only fork (go.mod replace). A dependency
        # that drags a cloud SDK, gRPC or protobuf back into the core build
        # fails here before it ships. See the Makefile target.
        run: make size-check

  release-config:
    name: goreleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # The release pipeline only ran on tag push before, so a broken hook,
      # a module that no longer cross-compiles, or a missing archive file
      # surfaced when it was already blocking a release. A snapshot run
      # exercises the whole .goreleaser.yaml (check + before hooks + all
      # sixteen builds — lo, lo-full, kustomize-secret, lochat × 4 platforms
      # — + archives + checksums) without publishing. Same pinned goreleaser
      # as .github/workflows/release.yml.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean --skip=publish

      - name: Both lo builds are in the snapshot
        # The installer's asset-name contract: lo-<os>-<arch>.tar.gz (core)
        # and lo-full-<os>-<arch>.tar.gz (--full), each carrying a binary
        # named after the build, and both listed in checksums.txt.
        run: |
          set -euo pipefail
          for os in linux darwin; do for arch in amd64 arm64; do
            for flavor in lo lo-full; do
              a="dist/${flavor}-${os}-${arch}.tar.gz"
              test -f "${a}" || { echo "::error::missing ${a}"; exit 1; }
              tar -tzf "${a}" | grep -qx "${flavor}" || { echo "::error::${a} has no '${flavor}' member"; exit 1; }
              grep -q " ${flavor}-${os}-${arch}.tar.gz$" dist/checksums.txt || { echo "::error::${flavor}-${os}-${arch}.tar.gz not in checksums.txt"; exit 1; }
            done
          done; done
          # The host-platform snapshot binaries name their build.
          dist/lo_linux_amd64_v1/lo --version | grep -q '(core)'
          dist/lo-full_linux_amd64_v1/lo-full --version | grep -q '(full)'

  operator-tests:
    name: Bats Operator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain (b → argsh, yq)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq gettext-base
          # Pin the BINARY, not just the installer script. install.sh resolves
          # `releases/latest` with an UNAUTHENTICATED curl (it takes no token), so
          # on a rate-limited Actions runner IP the reply carries no "tag_name",
          # LATEST comes back empty and it exits "Failed to determine latest
          # version". That is how E2E broke on 2026-08-07 while it sat skipped
          # behind a red gate, having passed on 2026-08-01 with this same pinned
          # URL. Pinning removes the API call; the checksum makes the download
          # verifiable, which resolving "latest" never was.
          B_VERSION=4.18.6
          curl -fsSL "https://github.com/fentas/b/releases/download/v${B_VERSION}/b-linux-amd64.tar.gz" -o /tmp/b.tar.gz
          echo "096566667b7f788ff1436c7411b1c2204a231bda9ca1d325b7651e4ccd4e7d94  /tmp/b.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/b.tar.gz -C "${HOME}/.local/bin" b
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          b install
          ./.bin/argsh builtins install   # argsh.so — bats runtime + builtins

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build lo (the hook shims exec the Go binary; bats test 37 skips without it)
        run: make build

      - name: Run operator tests
        env:
          # Same .bin mount as the unit-tests job (see comment there).
          PATH_BIN: ${{ github.workspace }}/.bin
        run: ./.bin/argsh test tests/operator/

  e2e-lo-up:
    name: E2E (lo up --ci, ${{ matrix.lo_impl }})
    runs-on: ubuntu-latest
    needs: [shellcheck, unit-tests, operator-tests]
    strategy:
      fail-fast: false
      matrix:
        # Which `lo` orchestrates the run. `go`: bin/lo, the canonical
        # implementation — this leg is its only real-cluster proof in CI.
        # `bash`: the same binary, routed to the frozen argsh tree by the
        # fixture's lok8s.yaml (spec.implementation.default: bash), which
        # execs <fixture>/.lok8s/lo with argv untouched, so the reference
        # keeps its own proof and the shim is exercised on the way. Before
        # the matrix existed the job put .lok8s first on PATH and never
        # built the binary: it proved the frozen tree only.
        lo_impl: [go, bash]
    # Bounded outer budget: provision (kind create + cilium bootstrap) runs
    # BEFORE `tilt ci` and is NOT covered by the tilt --timeout below, so a
    # hung provision must be killed by the job. ~18min ceiling; a healthy run
    # is well under that (see LOK8S_TILT_TIMEOUT + the outer `timeout` wrap).
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build lo (the binary under test; the bash leg routes through it too)
        run: make build

      - name: Select the implementation (lok8s.yaml spec.implementation)
        # The switch is the fixture's project file, never an environment
        # variable (the binary reads none for it). `bash` needs the tree
        # INSIDE the project: a routing never targets a checkout elsewhere
        # or the binary's cache extract, so the repo's .lok8s is copied in.
        # The routed exec also derives the toolchain from the project root
        # (<project>/.bin, never an inherited PATH_BIN: the entrypoint
        # sources `${PATH_BIN}/argsh`), so the repo's .bin is linked in too.
        env:
          FIXTURE: single-local-build
          IMPLEMENTATION: ${{ matrix.lo_impl }}
        run: |
          set -euo pipefail
          BASE="${GITHUB_WORKSPACE}/tests/e2e/${FIXTURE}"
          if [ "${IMPLEMENTATION}" = bash ]; then
            cp -R "${GITHUB_WORKSPACE}/.lok8s" "${BASE}/.lok8s"
            ln -s "${GITHUB_WORKSPACE}/.bin" "${BASE}/.bin"
          fi
          printf 'apiVersion: lok8s.dev/v1\nkind: Project\nmetadata:\n  name: e2e\nspec:\n  implementation:\n    default: %s\n' "${IMPLEMENTATION}" > "${BASE}/lok8s.yaml"
          cat "${BASE}/lok8s.yaml"

      - name: Skip host-side verification for the dev registries (10.125.0.0/16)
        # `lo up` stands up TLS registry containers on the project subnet
        # (spec.registries.tls: true in the fixture, the default: the cert
        # is minted into the docker volume <network>-registry-tls, which
        # this job proves end to end) and Tilt pushes the locally-built
        # image to the build registry (10.125.<slot>.101) over the host
        # Docker daemon. The runner does not trust the dev CA (no `lo
        # trust`), so the host `docker push` needs an insecure-registries
        # entry to skip verification; in-cluster pulls trust the CA through
        # certs.d regardless. This mirrors the range the framework's own
        # Hetzner provider trusts (see
        # .lok8s/providers/hetzner/.../etc/docker/daemon.json).
        run: |
          sudo mkdir -p /etc/docker
          # Merge (don't clobber) any existing daemon.json.
          existing='{}'
          [ -f /etc/docker/daemon.json ] && existing="$(cat /etc/docker/daemon.json)"
          echo "${existing}" \
            | jq '.["insecure-registries"] = (((.["insecure-registries"] // []) + ["10.125.0.0/16"]) | unique)' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          # Wait for the daemon to come back before the toolchain uses it.
          for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          docker info --format '{{json .RegistryConfig.InsecureRegistryCIDRs}}'

      - name: Install toolchain (b → argsh, kind, tilt, kustomize, khelm)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq gettext-base
          # Pin the BINARY, not just the installer script. install.sh resolves
          # `releases/latest` with an UNAUTHENTICATED curl (it takes no token), so
          # on a rate-limited Actions runner IP the reply carries no "tag_name",
          # LATEST comes back empty and it exits "Failed to determine latest
          # version". That is how E2E broke on 2026-08-07 while it sat skipped
          # behind a red gate, having passed on 2026-08-01 with this same pinned
          # URL. Pinning removes the API call; the checksum makes the download
          # verifiable, which resolving "latest" never was.
          B_VERSION=4.18.6
          curl -fsSL "https://github.com/fentas/b/releases/download/v${B_VERSION}/b-linux-amd64.tar.gz" -o /tmp/b.tar.gz
          echo "096566667b7f788ff1436c7411b1c2204a231bda9ca1d325b7651e4ccd4e7d94  /tmp/b.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/b.tar.gz -C "${HOME}/.local/bin" b
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          # No profile filter: `b install` pulls every binary in .bin/b.yaml —
          # the `local` set (kind, tilt, mkcert) + kustomize + the khelm
          # ChartRenderer exec plugin — everything `lo up` (kind driver + Tilt)
          # needs. Vendored .bin already carries most; this reconciles to the lock.
          b install
          ./.bin/argsh builtins install   # argsh.so — argsh runtime + builtins
          # `b install` drops every binary into .bin (next to b.yaml). Put it on
          # PATH so the later verify/diagnostics steps get kubectl/kind/tilt, and
          # `lo` (which shells out to them) finds them without a per-step export.
          echo "${GITHUB_WORKSPACE}/.bin" >> "${GITHUB_PATH}"

      - name: Build the Secret plugin (the bash leg mints the registry cert through it)
        # The bash implementation execs .kustomize/secrets.lok8s.dev/v1/secret/Secret
        # to mint the registry TLS cert (the Go leg serves the generator
        # in-process). `lo kustomize build` from the fixture cannot see the
        # plugin sources (they live at the repo root), so build them here into
        # the plugin home the run step exports (KUSTOMIZE_PLUGIN_HOME).
        run: make -C kustomize build BIN_ROOT="${GITHUB_WORKSPACE}/.kustomize"

      - name: Run lo up --ci against the single-local-build fixture
        # Exercises the real path: provision a kind cluster + docker registries,
        # bootstrap Cilium, then `tilt ci` builds the app image, pushes it to
        # the build registry, deploys it, and waits for the pod to be Ready.
        # `lo up --ci` exits non-zero unless the whole stack converges, so the
        # step's exit status IS the end-to-end result.
        env:
          FIXTURE: single-local-build
          DOMAIN: 127.lok8s.dev
          CLUSTER: e2e-slb
          # tilt ci's own readiness wait (build+deploy). The provision phase
          # before it is bounded by the outer `timeout` wrap instead.
          LOK8S_TILT_TIMEOUT: 300s
          # Outer wall-clock kill for the whole `lo up --ci` (provision + tilt),
          # so a hung kind-create / cilium-wait fails in minutes, not at the
          # job's 18min ceiling.
          LOK8S_UP_TIMEOUT: 720
          IMPLEMENTATION: ${{ matrix.lo_impl }}
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE}"
          BASE="${ROOT}/tests/e2e/${FIXTURE}"

          # Replicate the e2e helper env (tests/e2e/lib/helpers.bash :: e2e::init):
          # the fixture dir is PATH_BASE; framework + toolchain stay at the repo root.
          # On the bash leg the routed exec exports PATH_LOK8S=<fixture>/.lok8s
          # (the copied tree) to its bash child itself; the Tilt extension and
          # .lok8s/libs/tilt read PATH_BASE only, so nothing else needs it.
          export PATH_BASE="${BASE}"
          export PATH_LOK8S="${ROOT}/.lok8s"
          export PATH_SCRIPTS="${PATH_LOK8S}"
          export PATH_BIN="${ROOT}/.bin"
          export PATH_CLUSTERS="${BASE}/clusters"
          # No PATH_SECRETS on purpose: a PATH-only shell is what broke the
          # registry TLS mint in v0.3.1 (the bash entrypoint defaults the
          # variable, the binary must not need it).
          export KUSTOMIZE_PLUGIN_HOME="${ROOT}/.kustomize"
          export DOMAIN_NAME="${DOMAIN}"
          export LOK8S_CLUSTER_NAME="${CLUSTER}"
          export KUBECONFIG="${BASE}/.kubeconfig/${CLUSTER}.yaml"
          mkdir -p "${BASE}/.kubeconfig"
          # No host-port bind: the kind node shouldn't fight the runner for 80/443.
          export LOK8S_HOST_PORTS=false
          # Deterministic Tilt port (slot 127 -> 10427), matching the e2e helpers.
          export TILT_PORT=10427
          # Expose lo + the b toolchain to Tilt's local()/docker_build subprocesses.
          # bin/ FIRST: `lo` must resolve to the Go binary built above, never to
          # the argsh entrypoint in .lok8s/ (which stays on PATH for the
          # frozen tree's own helpers and for the bash leg's exec).
          export PATH="${ROOT}/bin:${PATH_LOK8S}:${PATH_BIN}:${PATH}"

          echo "::group::which lo"
          # Fail loud when PATH does not resolve to the binary under test.
          test "$(command -v lo)" = "${ROOT}/bin/lo"
          lo --version
          # The leg must run the implementation the matrix names: the frozen
          # tree prints a `bash` row in `lo version`, the Go code does not
          # (the same proof hack/lib/parity.sh's parity::prove_switch makes).
          # Captured first, then grepped: `lo version | grep -q` dies of
          # SIGPIPE under pipefail once grep has its match (rc 141).
          version_out="$(lo version 2>/dev/null)"
          if [ "${IMPLEMENTATION}" = bash ]; then
            grep -q '^bash ' <<<"${version_out}"
          else
            ! grep -q '^bash ' <<<"${version_out}"
          fi
          echo "::endgroup::"

          echo "::group::lo doctor"
          lo doctor || true
          echo "::endgroup::"

          # `lo up --ci` = provision::dispatch (kind + registries + cilium) then
          # `tilt ci` (build + deploy + wait). Gate on its real exit status.
          # Domain comes from DOMAIN_NAME (domain::resolve honors it; no .active
          # in the fixture) — the same env path the e2e helpers exercise.
          timeout "${LOK8S_UP_TIMEOUT}" \
            lo up --ci --timeout "${LOK8S_TILT_TIMEOUT}"

      - name: Verify the app pod is Running
        run: |
          set -euo pipefail
          export KUBECONFIG="${GITHUB_WORKSPACE}/tests/e2e/${FIXTURE:-single-local-build}/.kubeconfig/${CLUSTER:-e2e-slb}.yaml"
          kubectl get pods -A
          phase="$(kubectl get pod -l app=app -o jsonpath='{.items[0].status.phase}')"
          echo "app pod phase: ${phase}"
          test "${phase}" = "Running"
        env:
          FIXTURE: single-local-build
          CLUSTER: e2e-slb

      - name: Diagnostics on failure
        if: failure()
        run: |
          export KUBECONFIG="${GITHUB_WORKSPACE}/tests/e2e/single-local-build/.kubeconfig/e2e-slb.yaml"
          echo "::group::docker ps"
          docker ps -a || true
          echo "::endgroup::"
          echo "::group::kind clusters"
          kind get clusters || true
          echo "::endgroup::"
          echo "::group::nodes + pods"
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          echo "::endgroup::"
          echo "::group::cilium + app describe"
          kubectl -n kube-system get pods || true
          kubectl describe pod -l app=app || true
          kubectl -n kube-system logs -l k8s-app=cilium --tail=50 || true
          echo "::endgroup::"

  loup-bundle:
    name: lo-up Bundle (byte-exact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read .archive/legacy/install/argsh.pin
        id: pin
        run: |
          set -euo pipefail
          # The published bundle embeds the argsh runtime's version and commit,
          # so the rebuild below is only comparable when it runs against the
          # SAME revision. .archive/legacy/install/argsh.pin is that record;
          # .archive/legacy/install/build refuses to build from anything else.
          # (The argsh installer retired to .archive/legacy/ when the Go `lo`
          # binary became the distribution path — see install/README.md. The
          # bundle at docs/public/lo-up stays published for the legacy path,
          # so this gate stays.)
          while IFS='=' read -r k v; do
            case "${k}" in
              ref|describe|minifier_release|minifier_sha256)
                echo "${k}=${v}" >> "${GITHUB_OUTPUT}" ;;
            esac
          done < .archive/legacy/install/argsh.pin

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arg-sh/argsh
          ref: ${{ steps.pin.outputs.ref }}
          # .archive/legacy/install/build runs `git describe --tags` in this checkout and the
          # result is stamped into the bundle — a shallow clone has no tags and
          # would stamp "unknown".
          fetch-depth: 0
          path: .argsh-src

      - name: Install GNU gettext and the pinned minifier
        run: |
          set -euo pipefail
          # GNU envsubst specifically: `argsh minify` renders its template with
          # a SHELL-FORMAT whitelist, which renvsubst rejects (see .archive/legacy/install/build).
          sudo apt-get update && sudo apt-get install -y gettext-base
          # `argsh minify` shells out to `minifier`, a Rust crate in the argsh
          # repo, published as a release asset. Pinned + checksummed, same rule
          # as the `b` download in unit-tests.
          mkdir -p .argsh-src/.bin
          curl -fsSL -o .argsh-src/.bin/minifier \
            "https://github.com/arg-sh/argsh/releases/download/${{ steps.pin.outputs.minifier_release }}/minifier-linux-amd64"
          echo "${{ steps.pin.outputs.minifier_sha256 }}  .argsh-src/.bin/minifier" | sha256sum -c -
          chmod +x .argsh-src/.bin/minifier

      - name: Rebuild docs/public/lo-up from .archive/legacy/install/lo-up
        run: ARGSH_SRC="${GITHUB_WORKSPACE}/.argsh-src" .archive/legacy/install/build

      - name: The published installer is not stale
        run: |
          git diff --exit-code -- docs/public/lo-up || {
            echo "::error::docs/public/lo-up does not match a rebuild from .archive/legacy/install/lo-up."
            echo "::error::Every legacy 'lo-up' user is being served the old script."
            echo "::error::Fix: ARGSH_SRC=/path/to/arg-sh/argsh .archive/legacy/install/build, then commit the bundle."
            exit 1
          }
