name: Provision Cluster
on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'lok8s domain to provision'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.lok8s/*/cluster.lok8s.yaml'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Supply-chain rule: no remote script is executed at all here, and the
          # other binary versions are pinned by the committed .bin/b.yaml +
          # .bin/b.lock that `b install` consumes.
          # Pin the BINARY, not just the installer script. install.sh resolves
          # `releases/latest` with an UNAUTHENTICATED curl (it takes no token), so
          # on a rate-limited Actions runner IP the reply carries no "tag_name",
          # LATEST comes back empty and it exits "Failed to determine latest
          # version". That is how E2E broke on 2026-08-07 while it sat skipped
          # behind a red gate, having passed on 2026-08-01 with this same pinned
          # URL. Pinning removes the API call; the checksum makes the download
          # verifiable, which resolving "latest" never was.
          B_VERSION=4.18.6
          curl -fsSL "https://github.com/fentas/b/releases/download/v${B_VERSION}/b-linux-amd64.tar.gz" -o /tmp/b.tar.gz
          echo "096566667b7f788ff1436c7411b1c2204a231bda9ca1d325b7651e4ccd4e7d94  /tmp/b.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/b.tar.gz -C "${HOME}/.local/bin" b
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          b install

      - name: Detect changed domains
        id: detect
        if: github.event_name == 'push'
        run: |
          domains=$(git diff --name-only HEAD~1 HEAD -- '.lok8s/*/cluster.lok8s.yaml' \
            | sed 's|.lok8s/\(.*\)/cluster.lok8s.yaml|\1|' \
            | tr '\n' ' ')
          echo "domains=${domains}" >> "$GITHUB_OUTPUT"

      # Cluster registration with kubehz needs NO platform token — `lo provision`
      # registers a PENDING cluster anonymously and the user proves ownership by
      # claiming it in the dashboard (see the `spinup` reusable workflow for the
      # full claim handshake). Only HCLOUD_TOKEN is required.
      - name: Provision
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          if [[ -n "${DOMAIN}" ]]; then
            lo provision --force --domain "${DOMAIN}"
          else
            for domain in ${{ steps.detect.outputs.domains }}; do
              lo provision --force --domain "${domain}"
            done
          fi
