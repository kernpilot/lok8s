name: E2E

# The cluster-backed jobs: the kind integration job that used to run only
# on pushes to main from ci.yml, and the cluster matrix (tests/e2e/*).
# They live here so ci.yml produces the same check set on a pull request
# and on main, and the main-protection ruleset can require exactly that
# set. Runs on every push to main, once a night, and on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration Tests (Kind)
    runs-on: ubuntu-latest
    # The push-to-main gate that used to sit here is the workflow trigger
    # now. No `needs:` on the ci.yml jobs: they run in another workflow.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: lok8s-test

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Apply lok8s CRDs
        run: |
          kubectl apply --server-side -f operator/crds/
          kubectl wait --for=condition=Established crd --all --timeout=60s

      - name: Create and read back a Lo resource
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: cluster.lok8s.dev/v1beta1
          kind: Lo
          metadata:
            name: ci-smoke
          spec:
            cluster:
              domain: ci.lok8s.dev
            runtime: kind
            bootstrap:
              - cilium
          EOF
          kubectl get lo ci-smoke -o yaml
          test "$(kubectl get lo ci-smoke -o jsonpath='{.spec.cluster.domain}')" = "ci.lok8s.dev"

      - name: Validate CRD schemas reject bad specs
        run: |
          if kubectl apply -f - <<'EOF' 2>/dev/null
          apiVersion: cluster.lok8s.dev/v1beta1
          kind: Lo
          metadata:
            name: ci-bad
          spec: {}
          EOF
          then
            echo "expected schema validation to reject a spec without cluster.domain" >&2
            exit 1
          fi

      - name: ClusterInventory rejects non-metadata fields and round-trips
        run: |
          # The inventory CRD (lok8s.dev group, cluster-scoped singleton) is
          # metadata-ONLY. lo writes it with server-side apply
          # (libs/inventory/main), and SSA REJECTS undeclared fields outright
          # ("field not declared in schema") rather than pruning them — values/
          # secrets structurally cannot land in it. The old assertion expected
          # client-side-apply pruning and failed on every run: SSA errors first.
          cat > /tmp/smuggled-inventory.yaml <<'EOF'
          apiVersion: lok8s.dev/v1alpha1
          kind: ClusterInventory
          metadata:
            name: cluster
          spec:
            lok8sVersion: 0.1.0
            kind: kubeone
            provider: hetzner
            kubernetesVersion: v1.31.12
            specHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            renderedAt: "2026-01-01T00:00:00Z"
            values:
              smuggled: chart-values-must-be-rejected
            addons:
              - name: cilium
                chartVersion: 1.19.2
                category: networking
                source: addon
                inlineValues: must-be-rejected-too
          EOF
          if kubectl apply --server-side --field-manager=lok8s               -f /tmp/smuggled-inventory.yaml 2>/tmp/smuggled-err.txt; then
            echo "smuggled spec.values/inlineValues were ACCEPTED — the schema no longer rejects unknown fields" >&2
            exit 1
          fi
          grep -q 'field not declared in schema' /tmp/smuggled-err.txt             || { echo "apply failed for an unexpected reason:" >&2; cat /tmp/smuggled-err.txt >&2; exit 1; }

          # A clean CR (production shape) round-trips via the same SSA path.
          kubectl apply --server-side --field-manager=lok8s -f - <<'EOF'
          apiVersion: lok8s.dev/v1alpha1
          kind: ClusterInventory
          metadata:
            name: cluster
          spec:
            lok8sVersion: 0.1.0
            kind: kubeone
            provider: hetzner
            kubernetesVersion: v1.31.12
            specHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            renderedAt: "2026-01-01T00:00:00Z"
            addons:
              - name: cilium
                chartVersion: 1.19.2
                category: networking
                source: addon
          EOF
          test "$(kubectl get clusterinventories.lok8s.dev cluster -o jsonpath='{.spec.kubernetesVersion}')" = "v1.31.12"
          kubectl get clusterinventories.lok8s.dev cluster -o json | jq -e '
            (.spec | has("values") | not) and
            (.spec.addons[0] | has("inlineValues") | not) and
            (.spec.addons[0].chartVersion == "1.19.2")'
          # Status is a subresource: writable via --subresource, never via spec apply.
          kubectl patch clusterinventories.lok8s.dev cluster --subresource=status --type=merge \
            -p '{"status":{"lastReported":"2026-01-01T00:00:00Z","observedAddons":[{"name":"cilium","version":"1.19.2","healthy":true}]}}'
          kubectl get clusterinventories.lok8s.dev cluster -o json \
            | jq -e '.status.observedAddons[0].healthy == true'

      - name: All cluster kinds resolve under cluster.lok8s.dev
        run: |
          # Every cluster kind (incl. the regrouped Deploy + new Kkp/KubeOne)
          # must serve under the one group. A 404 here = a group drift.
          for kind in Lo Capi Kkp KubeOne Deploy; do
            kubectl get --raw "/apis/cluster.lok8s.dev/v1beta1" \
              | grep -q "\"kind\":\"${kind}\"" \
              || { echo "kind ${kind} not served under cluster.lok8s.dev" >&2; exit 1; }
          done
          # Round-trip a Deploy (the kind whose group was corrected).
          kubectl apply -f - <<'EOF'
          apiVersion: cluster.lok8s.dev/v1beta1
          kind: Deploy
          metadata:
            name: ci-deploy
          spec:
            clusterRef:
              domain: ci.lok8s.dev
          EOF
          test "$(kubectl get deploys.cluster.lok8s.dev ci-deploy -o jsonpath='{.spec.clusterRef.domain}')" = "ci.lok8s.dev"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build lo-full (it renders in process, so no host kustomize)
        run: make build-full

      - name: lo bootstrap names what the apply drops of a client-side writer
        # A `kubectl apply` without --server-side creates a Namespace. The
        # manager kubectl-client-side-apply (an Update entry that owns the
        # last-applied annotation) then owns its labels app and team and
        # its annotation note. The target of lo sets the label app only.
        # The server-side apply of lo moves the fields of that writer to lo,
        # then drops the label team and the annotation note. This step
        # proves the read of the field managers on a real API server:
        # kubectl get -f - prints a List for a stdin, and the jsonpath reads
        # managedFields and prints each fieldsV1 set as JSON. The dry run
        # names the object and exits 1 (kubectl diff does not show the
        # drop). Its diff shows a change anyway: when kubectl applies an
        # object that has the last-applied annotation server-side, the API
        # server updates that annotation. So this step proves the count and
        # the [warn] line; the unit tests prove that a diff with no change
        # counts as differs. The real run names the dropped keys, and the
        # last-applied annotation stays. A second dry run finds no
        # client-side writer.
        # The bash twin sends the same kubectl argv and reads the same text
        # in the same way (hack/parity-orchestrate.sh).
        run: |
          set -euo pipefail
          proj="${RUNNER_TEMP}/csa"
          d="${proj}/clusters/csa.lok8s.dev"
          mkdir -p "${d}/targets/ns" "${proj}/.kubeconfig"
          printf 'apiVersion: lok8s.dev/v1\nkind: Project\nmetadata:\n  name: csa\nspec:\n  implementation:\n    default: go\n' > "${proj}/lok8s.yaml"
          cat > "${d}/cluster.lok8s.yaml" <<'EOF'
          apiVersion: cluster.lok8s.dev/v1beta1
          kind: Lo
          metadata:
            name: lok8s-test
          spec:
            runtime: kind
            cluster:
              domain: csa.lok8s.dev
            network:
              name: csanet
              cidr: 10.99.12.0/24
            registries:
              tls: false
            bootstrap:
              - ./targets/ns
          EOF
          printf 'resources:\n  - namespace.yaml\n' > "${d}/targets/ns/kustomization.yaml"
          printf 'apiVersion: v1\nkind: Namespace\nmetadata:\n  name: lok8s-csa\n  labels:\n    app: lok8s\n' > "${d}/targets/ns/namespace.yaml"
          kind get kubeconfig --name lok8s-test > "${proj}/.kubeconfig/lok8s-test.yaml"
          # The data units come from the checkout, as in the go leg of the
          # cluster matrix.
          export PATH_LOK8S="${GITHUB_WORKSPACE}/.lok8s"
          lo="${GITHUB_WORKSPACE}/bin/lo-full"

          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: Namespace
          metadata:
            name: lok8s-csa
            labels:
              app: lok8s
              team: ci
            annotations:
              note: ci
          EOF
          # For the record: the field managers that lo reads (key names only).
          kubectl get namespace lok8s-csa --show-managed-fields -o json \
            | jq '.metadata.managedFields | map({manager, operation, subresource, apiVersion, fieldsV1})'

          cd "${proj}"
          warn='[warn] bootstrap: ns: Namespace lok8s-csa: a client-side writer (kubectl-client-side-apply) owns fields; '
          warn+='the apply moves them to lo and drops what the target does not set: label team; annotation note'
          rc=0
          "${lo}" bootstrap --domain csa.lok8s.dev --dry-run > dry.out 2> dry.err || rc=$?
          cat dry.out dry.err
          test "${rc}" -eq 1
          grep -qE '^bootstrap dry-run: ns: differs.*\(client-side owned: 1\)$' dry.out
          grep -qxF "${warn}" dry.err
          # The dry run changed nothing.
          test "$(kubectl get namespace lok8s-csa -o jsonpath='{.metadata.labels.team}')" = ci

          # Each run: the rc first, then the output, then the test of the rc
          # (set -e would stop before the output).
          rc=0
          "${lo}" bootstrap --domain csa.lok8s.dev > real.out 2> real.err || rc=$?
          cat real.out real.err
          test "${rc}" -eq 0
          grep -qF "${warn}" real.out real.err
          grep -qF '[warn] bootstrap: ns: Namespace lok8s-csa: the apply dropped label team; annotation note' real.out real.err
          # The label team and the annotation note are gone. The label app,
          # the label that the API server sets and the last-applied
          # annotation stay.
          kubectl get namespace lok8s-csa -o json | jq -e '
            (.metadata.labels | keys) == ["app", "kubernetes.io/metadata.name"] and
            (.metadata.annotations | has("note") | not) and
            (.metadata.annotations | has("kubectl.kubernetes.io/last-applied-configuration"))'

          rc=0
          "${lo}" bootstrap --domain csa.lok8s.dev --dry-run > dry2.out 2> dry2.err || rc=$?
          cat dry2.out dry2.err
          test "${rc}" -eq 0
          grep -qx 'bootstrap dry-run: ns: unchanged' dry2.out
          if grep -q 'client-side' dry2.err; then
            echo "the second dry run still names a client-side writer" >&2
            exit 1
          fi

  cluster-matrix:
    name: Cluster (${{ matrix.scenario }}, ${{ matrix.impl }})
    runs-on: ubuntu-latest
    # A backstop, nothing more: every call into `lo` is bounded by its own
    # `timeout` in tests/e2e/lib/helpers.bash, so a hang dies at the
    # operation that hung, with a message. This cap has to sit ABOVE the
    # sum of those budgets or it fires first and names nothing — and a
    # job-level timeout CANCELS the job, which is a different thing from
    # a failure (the diagnostics below use `always()` for exactly that
    # reason: `failure()` does not run on a cancelled job). The worst leg
    # (lifecycle) budgets 5x300 + 2x180 + 5x120 = 41 minutes; the
    # toolchain setup above costs ~6. A healthy leg is ~3 minutes.
    timeout-minutes: 60
    strategy:
      # Every leg runs. One broken scenario must not hide the state of the
      # other legs.
      fail-fast: false
      matrix:
        # scenario × implementation. Both implementations are first class,
        # and the leg is chosen the way a user chooses it: the scenario's
        # lok8s.yaml (spec.implementation), read by the SAME binary. There
        # is no environment variable for it, and nothing here invokes the
        # bash entrypoint directly.
        #
        # `mixed` is the shape a project adopts while it migrates: a `go`
        # default with a few commands routed to the bash tree. The
        # lifecycle scenario carries it, with status and registry routed
        # against a live cluster. `version` rides along because it is the
        # provenance probe: its `bash` row is how e2e::assert_provenance
        # proves the routed half really execs the tree, and `lo doctor`
        # (not routed) proves the other half is still native.
        #
        # cache-mode runs the go leg only: it is the slowest scenario (a
        # `tilt ci` that pre-pulls from Docker Hub), and ci.yml's
        # e2e-lo-up already runs the same Tilt path on both
        # implementations over the single-local-build fixture on every
        # pull request. single-local-build is not here for the same
        # reason — e2e-lo-up owns it.
        #
        # suc runs the go leg only. Its subject is the
        # system-upgrade-controller addon (the narrowed RBAC and the two
        # images pinned by digest) with one real Plan, not the
        # implementation. Its budget is 31 minutes at most
        # (tests/e2e/suc/test.bats).
        include:
          - {scenario: lifecycle, impl: go}
          - {scenario: lifecycle, impl: bash}
          - {scenario: lifecycle, impl: mixed, routed: version status registry}
          - {scenario: registry-tls, impl: go}
          - {scenario: registry-tls, impl: bash}
          - {scenario: shared-registries, impl: go}
          - {scenario: shared-registries, impl: bash}
          - {scenario: no-services, impl: go}
          - {scenario: no-services, impl: bash}
          - {scenario: cache-mode, impl: go}
          - {scenario: suc, impl: go}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build lo (the one binary every leg runs)
        run: make build

      - name: Host prerequisites (dig for the DNS preflight, jq, envsubst)
        # Without dig the DNS preflight cannot run. It would SKIP the
        # scenario, and E2E_STRICT=1 below turns that skip into a failure
        # rather than a green leg that tested nothing — so install it.
        run: sudo apt-get update && sudo apt-get install -y bind9-dnsutils jq gettext-base

      - name: Skip host-side verification for the dev registries (10.125.0.0/16)
        # The plain-HTTP scenarios put registries on the project subnet.
        # In-cluster pulls trust them through certs.d either way; a host
        # docker pull needs the range marked insecure. This mirrors the
        # range the framework's own Hetzner provider trusts.
        run: |
          sudo mkdir -p /etc/docker
          existing='{}'
          [ -f /etc/docker/daemon.json ] && existing="$(cat /etc/docker/daemon.json)"
          echo "${existing}" \
            | jq '.["insecure-registries"] = (((.["insecure-registries"] // []) + ["10.125.0.0/16"]) | unique)' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          docker info --format '{{json .RegistryConfig.InsecureRegistryCIDRs}}'

      - name: Install toolchain (b → argsh, kind, tilt, kustomize, khelm)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pin the binary, not just the installer: install.sh resolves
          # `releases/latest` with an unauthenticated curl, which a
          # rate-limited runner IP answers without a tag_name. The
          # checksum makes the download verifiable, which resolving
          # "latest" never was.
          B_VERSION=4.18.8
          curl -fsSL "https://github.com/fentas/b/releases/download/v${B_VERSION}/b-linux-amd64.tar.gz" -o /tmp/b.tar.gz
          echo "297e07f301060480a78380afae066b3c0013c572d704862e2b2f2a4477540aad  /tmp/b.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/b.tar.gz -C "${HOME}/.local/bin" b
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          b install
          ./.bin/argsh builtins install   # argsh.so — the argsh runtime
          # .bin holds the tools `lo` shells out to; .bin/bin holds bats
          # (installed by the next step, not by b) and .bin/lib the
          # bats-support/bats-assert the helpers load.
          echo "${GITHUB_WORKSPACE}/.bin" >> "${GITHUB_PATH}"
          echo "${GITHUB_WORKSPACE}/.bin/bin" >> "${GITHUB_PATH}"

      - name: Install bats and its libraries (pinned)
        # NOT left to `b install`. On the first dispatch of this matrix it
        # printed "github.com/bats-core/bats-core ... fail!" for exactly
        # this entry and still exited 0, so every leg died at `bats:
        # command not found` — a silent skip that cost ten green-looking
        # 30-second failures. These land where tests/lib/bats_libs.bash
        # looks (.bin/bin and .bin/lib), at the versions a developer
        # machine carries, each tarball checksum-verified.
        run: |
          set -euo pipefail
          install_tarball() { # <repo> <tag> <sha256> <dest>
            local repo="$1" tag="$2" sum="$3" dest="$4" tmp
            tmp="$(mktemp -d)"
            curl -fsSL "https://github.com/bats-core/${repo}/archive/refs/tags/${tag}.tar.gz" -o "${tmp}/src.tar.gz"
            echo "${sum}  ${tmp}/src.tar.gz" | sha256sum -c -
            mkdir -p "${dest}"
            tar -xzf "${tmp}/src.tar.gz" -C "${dest}" --strip-components=1
            rm -rf "${tmp}"
          }
          BIN="${GITHUB_WORKSPACE}/.bin"
          install_tarball bats-core v1.13.0 \
            a85e12b8828271a152b338ca8109aa23493b57950987c8e6dff97ba492772ff3 "${BIN}/src/bats-core"
          "${BIN}/src/bats-core/install.sh" "${BIN}"
          install_tarball bats-support v0.3.0 \
            7815237aafeb42ddcc1b8c698fc5808026d33317d8701d5ec2396e9634e2918f "${BIN}/lib/bats-support"
          install_tarball bats-assert v2.1.0 \
            98ca3b685f8b8993e48ec057565e6e2abcc541034ed5b0e81f191505682037fd "${BIN}/lib/bats-assert"

      - name: Verify the prerequisites
        # The suite fails a MISSING prerequisite rather than skipping
        # (E2E_STRICT below), but bats is the runner itself and cannot
        # check for its own absence. This step is where a broken
        # toolchain install stops the job, naming what is missing,
        # instead of surfacing as "command not found" inside the run.
        run: |
          set -euo pipefail
          missing=0
          for t in bats kind docker kustomize yq jq tilt dig openssl script; do
            if command -v "${t}" >/dev/null 2>&1; then
              printf '  ok      %-10s %s\n' "${t}" "$(command -v "${t}")"
            else
              printf '  MISSING %s\n' "${t}"; missing=1
            fi
          done
          for d in bats-support bats-assert; do
            if [ -d "${GITHUB_WORKSPACE}/.bin/lib/${d}" ]; then
              printf '  ok      %s\n' "${d}"
            else
              printf '  MISSING %s\n' "${d}"; missing=1
            fi
          done
          bats --version
          [ "${missing}" -eq 0 ] || { echo "::error::the toolchain install did not provide every prerequisite"; exit 1; }

      - name: Build the Secret plugin (the bash leg mints the registry cert through it)
        # The bash implementation execs
        # .kustomize/secrets.lok8s.dev/v1/secret/Secret to mint the
        # registry TLS certificate; the Go build serves that generator
        # in-process. Built here for every leg, so the step is one line
        # rather than one condition.
        run: make -C kustomize build BIN_ROOT="${GITHUB_WORKSPACE}/.kustomize"

      - name: ${{ matrix.scenario }} (${{ matrix.impl }})
        env:
          E2E: '1'
          # A missing prerequisite is a FAILURE here, not a skip: this job
          # installs every one of them, so a skipped leg would be a green
          # check over an empty run.
          E2E_STRICT: '1'
          E2E_LO_IMPL: ${{ matrix.impl }}
          E2E_LO_ROUTED: ${{ matrix.routed }}
        run: |
          set -euo pipefail
          # The ambient project pointers of a developer shell are not set
          # on a runner, but unset them anyway: inherited, they redirect
          # every write into another project.
          unset PATH_BASE PATH_BIN PATH_LOK8S PATH_SCRIPTS PATH_CLUSTERS \
                PATH_SECRETS PATH_TESTS DOMAIN_NAME LOK8S_CLUSTER_NAME \
                KUBECONFIG KUSTOMIZE_PLUGIN_HOME || true
          bats "tests/e2e/${{ matrix.scenario }}/test.bats"

      - name: The terminal transcripts
        # What the confirmation prompt printed and what was answered. Only
        # the lifecycle scenario writes one.
        if: always()
        timeout-minutes: 5
        run: |
          f="tests/e2e/${{ matrix.scenario }}/.e2e-state/pty-transcript.log"
          [ -s "${f}" ] && cat "${f}" || echo "no pty transcript for this scenario"

      - name: What is left on the runner
        # The scenario asserts this itself. Printing it makes a failure
        # readable without a re-run.
        if: always()
        timeout-minutes: 5
        run: |
          kind get clusters || true
          docker ps -a --format '{{.Names}}\t{{.Status}}'
          docker volume ls --format '{{.Name}}'
          docker network ls --format '{{.Name}}'

      - name: Cluster and registry logs
        # A provision that fails leaves nothing else to look at: the
        # scenario tears its cluster down, and a runner is gone minutes
        # later. `kind export logs` writes the kubelet, containerd and
        # control-plane logs of whatever is still up, and the registry
        # containers explain a push or a certificate failure. Without
        # this, every provision failure costs a re-run to diagnose, and a
        # nightly-only job may not reproduce at all.
        #
        # `always()`, not `failure()`: the case this exists for includes
        # the job hitting its cap, and a cap CANCELS the job. `failure()`
        # does not run on a cancelled job; `always()` does. Its own cap
        # keeps the failure path from hanging past the job's.
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p /tmp/e2e-logs
          for c in $(kind get clusters 2>/dev/null); do
            kind export logs "/tmp/e2e-logs/${c}" --name "${c}" || true
          done
          for n in $(docker ps -a --filter 'name=^e2e-' --format '{{.Names}}'; \
                     docker ps -a --filter 'name=^lok8s-registry-e2e-' --format '{{.Names}}'); do
            echo "===== docker logs ${n} ====="
            docker logs --tail 200 "${n}" 2>&1 || true
          done > /tmp/e2e-logs/containers.log
          tail -c 200000 /tmp/e2e-logs/containers.log || true

      - name: Upload the logs
        # always(), for the same reason as the step above. A green leg
        # uploads a small listing; a cancelled one uploads what it had.
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ matrix.scenario }}-${{ matrix.impl }}
          path: /tmp/e2e-logs
          retention-days: 7
          if-no-files-found: ignore
