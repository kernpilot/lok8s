name: E2E

# The cluster-backed jobs: the kind integration job that used to run only
# on pushes to main from ci.yml, and the cluster matrix (tests/e2e/*).
# They live here so ci.yml produces the same check set on a pull request
# and on main, and the main-protection ruleset can require exactly that
# set. Runs on every push to main, once a night, and on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration Tests (Kind)
    runs-on: ubuntu-latest
    # The push-to-main gate that used to sit here is the workflow trigger
    # now. No `needs:` on the ci.yml jobs: they run in another workflow.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: lok8s-test

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Apply lok8s CRDs
        run: |
          kubectl apply --server-side -f operator/crds/
          kubectl wait --for=condition=Established crd --all --timeout=60s

      - name: Create and read back a Lo resource
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: cluster.lok8s.dev/v1beta1
          kind: Lo
          metadata:
            name: ci-smoke
          spec:
            cluster:
              domain: ci.lok8s.dev
            runtime: kind
            bootstrap:
              - cilium
          EOF
          kubectl get lo ci-smoke -o yaml
          test "$(kubectl get lo ci-smoke -o jsonpath='{.spec.cluster.domain}')" = "ci.lok8s.dev"

      - name: Validate CRD schemas reject bad specs
        run: |
          if kubectl apply -f - <<'EOF' 2>/dev/null
          apiVersion: cluster.lok8s.dev/v1beta1
          kind: Lo
          metadata:
            name: ci-bad
          spec: {}
          EOF
          then
            echo "expected schema validation to reject a spec without cluster.domain" >&2
            exit 1
          fi

      - name: ClusterInventory rejects non-metadata fields and round-trips
        run: |
          # The inventory CRD (lok8s.dev group, cluster-scoped singleton) is
          # metadata-ONLY. lo writes it with server-side apply
          # (libs/inventory/main), and SSA REJECTS undeclared fields outright
          # ("field not declared in schema") rather than pruning them — values/
          # secrets structurally cannot land in it. The old assertion expected
          # client-side-apply pruning and failed on every run: SSA errors first.
          cat > /tmp/smuggled-inventory.yaml <<'EOF'
          apiVersion: lok8s.dev/v1alpha1
          kind: ClusterInventory
          metadata:
            name: cluster
          spec:
            lok8sVersion: 0.1.0
            kind: kubeone
            provider: hetzner
            kubernetesVersion: v1.31.12
            specHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            renderedAt: "2026-01-01T00:00:00Z"
            values:
              smuggled: chart-values-must-be-rejected
            addons:
              - name: cilium
                chartVersion: 1.19.2
                category: networking
                source: addon
                inlineValues: must-be-rejected-too
          EOF
          if kubectl apply --server-side --field-manager=lok8s               -f /tmp/smuggled-inventory.yaml 2>/tmp/smuggled-err.txt; then
            echo "smuggled spec.values/inlineValues were ACCEPTED — the schema no longer rejects unknown fields" >&2
            exit 1
          fi
          grep -q 'field not declared in schema' /tmp/smuggled-err.txt             || { echo "apply failed for an unexpected reason:" >&2; cat /tmp/smuggled-err.txt >&2; exit 1; }

          # A clean CR (production shape) round-trips via the same SSA path.
          kubectl apply --server-side --field-manager=lok8s -f - <<'EOF'
          apiVersion: lok8s.dev/v1alpha1
          kind: ClusterInventory
          metadata:
            name: cluster
          spec:
            lok8sVersion: 0.1.0
            kind: kubeone
            provider: hetzner
            kubernetesVersion: v1.31.12
            specHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            renderedAt: "2026-01-01T00:00:00Z"
            addons:
              - name: cilium
                chartVersion: 1.19.2
                category: networking
                source: addon
          EOF
          test "$(kubectl get clusterinventories.lok8s.dev cluster -o jsonpath='{.spec.kubernetesVersion}')" = "v1.31.12"
          kubectl get clusterinventories.lok8s.dev cluster -o json | jq -e '
            (.spec | has("values") | not) and
            (.spec.addons[0] | has("inlineValues") | not) and
            (.spec.addons[0].chartVersion == "1.19.2")'
          # Status is a subresource: writable via --subresource, never via spec apply.
          kubectl patch clusterinventories.lok8s.dev cluster --subresource=status --type=merge \
            -p '{"status":{"lastReported":"2026-01-01T00:00:00Z","observedAddons":[{"name":"cilium","version":"1.19.2","healthy":true}]}}'
          kubectl get clusterinventories.lok8s.dev cluster -o json \
            | jq -e '.status.observedAddons[0].healthy == true'

      - name: All cluster kinds resolve under cluster.lok8s.dev
        run: |
          # Every cluster kind (incl. the regrouped Deploy + new Kkp/KubeOne)
          # must serve under the one group. A 404 here = a group drift.
          for kind in Lo Capi Kkp KubeOne Deploy; do
            kubectl get --raw "/apis/cluster.lok8s.dev/v1beta1" \
              | grep -q "\"kind\":\"${kind}\"" \
              || { echo "kind ${kind} not served under cluster.lok8s.dev" >&2; exit 1; }
          done
          # Round-trip a Deploy (the kind whose group was corrected).
          kubectl apply -f - <<'EOF'
          apiVersion: cluster.lok8s.dev/v1beta1
          kind: Deploy
          metadata:
            name: ci-deploy
          spec:
            clusterRef:
              domain: ci.lok8s.dev
          EOF
          test "$(kubectl get deploys.cluster.lok8s.dev ci-deploy -o jsonpath='{.spec.clusterRef.domain}')" = "ci.lok8s.dev"

  cluster-matrix:
    name: Cluster (${{ matrix.scenario }}, ${{ matrix.impl }})
    runs-on: ubuntu-latest
    # Each leg stands a real kind cluster up and tears it down again, more
    # than once. A healthy leg is a few minutes; this is the ceiling that
    # kills a hung provision.
    timeout-minutes: 30
    strategy:
      # Every leg runs. One broken scenario must not hide the state of the
      # other nine.
      fail-fast: false
      matrix:
        # scenario × implementation. Both implementations are first class,
        # and the leg is chosen the way a user chooses it: the scenario's
        # lok8s.yaml (spec.implementation), read by the SAME binary. There
        # is no environment variable for it, and nothing here invokes the
        # bash entrypoint directly.
        #
        # `mixed` is the shape a project adopts while it migrates: a `go`
        # default with a couple of commands routed to the bash tree. The
        # lifecycle scenario carries it, with status and registry routed
        # against a live cluster.
        #
        # cache-mode runs the go leg only: it is the slowest scenario (a
        # `tilt ci` that pre-pulls from Docker Hub), and ci.yml's
        # e2e-lo-up already runs the same Tilt path on both
        # implementations over the single-local-build fixture on every
        # pull request. single-local-build is not here for the same
        # reason — e2e-lo-up owns it.
        include:
          - {scenario: lifecycle, impl: go}
          - {scenario: lifecycle, impl: bash}
          - {scenario: lifecycle, impl: mixed, routed: status registry}
          - {scenario: registry-tls, impl: go}
          - {scenario: registry-tls, impl: bash}
          - {scenario: shared-registries, impl: go}
          - {scenario: shared-registries, impl: bash}
          - {scenario: no-services, impl: go}
          - {scenario: no-services, impl: bash}
          - {scenario: cache-mode, impl: go}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build lo (the one binary every leg runs)
        run: make build

      - name: Host prerequisites (dig for the DNS preflight, jq, envsubst)
        # Without dig the DNS preflight cannot run. It would SKIP the
        # scenario, and E2E_STRICT=1 below turns that skip into a failure
        # rather than a green leg that tested nothing — so install it.
        run: sudo apt-get update && sudo apt-get install -y bind9-dnsutils jq gettext-base

      - name: Skip host-side verification for the dev registries (10.125.0.0/16)
        # The plain-HTTP scenarios put registries on the project subnet.
        # In-cluster pulls trust them through certs.d either way; a host
        # docker pull needs the range marked insecure. This mirrors the
        # range the framework's own Hetzner provider trusts.
        run: |
          sudo mkdir -p /etc/docker
          existing='{}'
          [ -f /etc/docker/daemon.json ] && existing="$(cat /etc/docker/daemon.json)"
          echo "${existing}" \
            | jq '.["insecure-registries"] = (((.["insecure-registries"] // []) + ["10.125.0.0/16"]) | unique)' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          docker info --format '{{json .RegistryConfig.InsecureRegistryCIDRs}}'

      - name: Install toolchain (b → argsh, bats, kind, tilt, kustomize, khelm)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pin the binary, not just the installer: install.sh resolves
          # `releases/latest` with an unauthenticated curl, which a
          # rate-limited runner IP answers without a tag_name. The
          # checksum makes the download verifiable, which resolving
          # "latest" never was.
          B_VERSION=4.18.6
          curl -fsSL "https://github.com/fentas/b/releases/download/v${B_VERSION}/b-linux-amd64.tar.gz" -o /tmp/b.tar.gz
          echo "096566667b7f788ff1436c7411b1c2204a231bda9ca1d325b7651e4ccd4e7d94  /tmp/b.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/b.tar.gz -C "${HOME}/.local/bin" b
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          b install
          ./.bin/argsh builtins install   # argsh.so — the argsh runtime
          # .bin holds the tools `lo` shells out to; .bin/bin holds bats,
          # and .bin/lib the bats-support/bats-assert the helpers load.
          echo "${GITHUB_WORKSPACE}/.bin" >> "${GITHUB_PATH}"
          echo "${GITHUB_WORKSPACE}/.bin/bin" >> "${GITHUB_PATH}"

      - name: Build the Secret plugin (the bash leg mints the registry cert through it)
        # The bash implementation execs
        # .kustomize/secrets.lok8s.dev/v1/secret/Secret to mint the
        # registry TLS certificate; the Go build serves that generator
        # in-process. Built here for every leg, so the step is one line
        # rather than one condition.
        run: make -C kustomize build BIN_ROOT="${GITHUB_WORKSPACE}/.kustomize"

      - name: ${{ matrix.scenario }} (${{ matrix.impl }})
        env:
          E2E: '1'
          # A missing prerequisite is a FAILURE here, not a skip: this job
          # installs every one of them, so a skipped leg would be a green
          # check over an empty run.
          E2E_STRICT: '1'
          E2E_LO_IMPL: ${{ matrix.impl }}
          E2E_LO_ROUTED: ${{ matrix.routed }}
        run: |
          set -euo pipefail
          # The ambient project pointers of a developer shell are not set
          # on a runner, but unset them anyway: inherited, they redirect
          # every write into another project.
          unset PATH_BASE PATH_BIN PATH_LOK8S PATH_SCRIPTS PATH_CLUSTERS \
                PATH_SECRETS PATH_TESTS DOMAIN_NAME LOK8S_CLUSTER_NAME \
                KUBECONFIG KUSTOMIZE_PLUGIN_HOME || true
          bats "tests/e2e/${{ matrix.scenario }}/test.bats"

      - name: The terminal transcripts
        # What the confirmation prompt printed and what was answered. Only
        # the lifecycle scenario writes one.
        if: always()
        run: |
          f="tests/e2e/${{ matrix.scenario }}/.e2e-state/pty-transcript.log"
          [ -s "${f}" ] && cat "${f}" || echo "no pty transcript for this scenario"

      - name: What is left on the runner
        # The scenario asserts this itself. Printing it makes a failure
        # readable without a re-run.
        if: always()
        run: |
          kind get clusters || true
          docker ps -a --format '{{.Names}}\t{{.Status}}'
          docker volume ls --format '{{.Name}}'
          docker network ls --format '{{.Name}}'
