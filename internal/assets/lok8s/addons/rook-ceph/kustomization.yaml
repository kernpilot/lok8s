# rook-ceph — the Rook-Ceph OPERATOR (controller + CRDs) + the ceph-csi-operator
# "work orders" (the Driver + OperatorConfig + plugin SAs + RBAC — see
# csi-drivers.yaml for the why). A generic, reusable atom: bootstrap `rook-ceph` by
# name to get the operator + CRDs (chart rook-ceph @v1.20.6) AND a live rbd
# CSIDriver. The operator + its work-order CRs/SAs/RBAC live in the privileged
# rook-ceph namespace; the CSIDriver it yields is cluster-scoped.
#
# CLUSTER GLUE stays behind (NOT in this addon): the CephCluster /
# CephBlockPool / CephObjectStore / StorageClass CRs (cluster.yaml,
# pool-*.yaml, object-store.yaml), the device-wipe job and the CP-rebuild
# runbooks — those encode the per-cluster storage topology (per-node
# deviceFilter, CRUSH device-class separation, mon placement) and live in the
# consuming cluster's rook-ceph target.
#
# Ships namespace.yaml: the rook-ceph namespace is part of the addon (not glue)
# because the operator's OSD/mon/mgr pods need privileged PodSecurity (host
# devices, raw block), so the addon owns that PSA-labelled namespace.
#
# lok8s.dev labels are metadata-only (includeSelectors: false): the chart's
# Deployment carries an immutable selector, so the transformer must not touch it
# (else in-place re-applies / migrations from a target fail).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: false
    pairs:
      lok8s.dev/name: rook-ceph
      lok8s.dev/type: system
      lok8s.dev/category: storage

namespace: rook-ceph

generators:
  - chart.yaml
  # ceph-csi-operator "work orders" (Driver + OperatorConfig + plugin SAs + RBAC;
  # see csi-drivers.yaml). NOT cluster glue: the driver name
  # (rook-ceph.rbd.csi.ceph.com) is fixed by the operator namespace, so it's
  # generic to the addon — unlike the per-cluster CephCluster/StorageClass CRs.
  - csi-drivers.yaml

resources:
  - namespace.yaml

# ── Least privilege for the CSI node plugin ───────────────────────────────────
# The node plugin DaemonSet runs on EVERY node (tolerations above), so its
# ClusterRole is the blast radius of one compromised node. The ceph-csi-drivers
# chart grants the node plugin the full upstream rule set unconditionally
# (templates/rbd-nodeplugin-cr-rbac.yaml); five of those rules exist only for
# volume encryption with an external KMS and are not used by a plain
# (unencrypted) RBD/CephFS mount, where kubelet hands the Ceph credentials to
# the plugin inside the CSI request. ceph-csi v3.17.0 (the plugin image this
# operator release pins) reaches them from these call sites only:
#
#   secrets get/list/watch     internal/kms/secretskms.go (metadata KMS
#                              passphrase Secret), internal/kms/vault_sa.go
#                              (tenant ServiceAccount token Secret), and
#                              internal/rbd/rbd_healer.go — the latter ONLY for
#                              volumes with the `mounter: rbd-nbd` parameter.
#                              list/watch have no live caller at all.
#   configmaps get             internal/kms/kms.go (the KMS config ConfigMap),
#                              internal/kms/vault_tokens.go (tenant config).
#                              The ceph cluster config is a mounted volume.
#   serviceaccounts get        internal/kms/vault_sa.go (vaulttenantsa).
#   serviceaccounts/token      internal/kms/vault_sa.go (TokenRequest for the
#     create                   tenant ServiceAccount). Lets the holder mint a
#                              token for ANY ServiceAccount: cluster-wide
#                              privilege escalation from any node.
#   tokenreviews create        no caller in ceph-csi; the upstream deploy docs
#                              tie it to the Vault token-reviewer setup
#                              (docs/rbd/deploy.md, csi-vaulttokenreview-rbac).
#
# Kept: nodes get (topology labels at start-up), persistentvolumes +
# volumeattachments get/list (the rbd-nbd healer scans them on every start),
# persistentvolumeclaims get, events (sidecars). None of them reads a credential.
#
# The patches are index-based (JSON patch) and GUARDED: every `remove` is
# preceded by a `test` on the rule it expects at that index, so a chart bump
# that reorders the rules fails the render instead of removing the wrong rule.
# Re-verify the indices against the chart's templates/*-nodeplugin-cr-rbac.yaml
# on every ceph-csi-drivers version bump. Descending order keeps the indices
# valid while earlier removes are applied.
#
# An unmatched target is a no-op for kustomize, so the cephfs patch sits idle
# while `drivers.cephfs.enabled` is false and takes effect the moment a cluster
# turns CephFS on.
#
# Need the upstream grants back (encrypted volumes with a KMS, or the
# `mounter: rbd-nbd` healer)? Bootstrap the `rook-ceph-csi-kms` addon after
# this one: it binds exactly these five rules to the node plugin
# ServiceAccount again. See docs/guide/addons.md.
patches:
  - target:
      kind: ClusterRole
      name: rook-ceph-rbd-csi-ceph-com-nodeplugin-cr
    patch: |-
      - op: test
        path: /rules/7/resources/0
        value: tokenreviews
      - op: remove
        path: /rules/7
      - op: test
        path: /rules/5/resources/0
        value: serviceaccounts/token
      - op: remove
        path: /rules/5
      - op: test
        path: /rules/4/resources/0
        value: serviceaccounts
      - op: remove
        path: /rules/4
      - op: test
        path: /rules/3/resources/0
        value: configmaps
      - op: remove
        path: /rules/3
      - op: test
        path: /rules/0/resources/0
        value: secrets
      - op: remove
        path: /rules/0
  - target:
      kind: ClusterRole
      name: rook-ceph-cephfs-csi-ceph-com-nodeplugin-cr
    patch: |-
      - op: test
        path: /rules/7/resources/0
        value: tokenreviews
      - op: remove
        path: /rules/7
      - op: test
        path: /rules/4/resources/0
        value: serviceaccounts/token
      - op: remove
        path: /rules/4
      - op: test
        path: /rules/3/resources/0
        value: serviceaccounts
      - op: remove
        path: /rules/3
      - op: test
        path: /rules/2/resources/0
        value: configmaps
      - op: remove
        path: /rules/2
      - op: test
        path: /rules/1/resources/0
        value: secrets
      - op: remove
        path: /rules/1
