# The CSI controller plugin's Secret access, namespaced. The chart grants the
# controller plugin `secrets get/list/watch` cluster-wide; the patches in
# kustomization.yaml remove that rule, and this Role gives back what the
# sidecars use: a plain `get` on the StorageClass-referenced secret (the
# provisioner, controller-expand and snapshotter secrets, which Rook creates
# as rook-csi-<type>-provisioner in the CephCluster namespace). The node
# secrets (rook-csi-<type>-node) are read by kubelet, not by this plugin.
#
# The Role lives in the Rook namespace, the one this addon pins. A cluster
# whose StorageClass points at a secret with another name or in another
# namespace adds its own Role + RoleBinding there (docs/guide/addons.md).
#
# The RoleBinding names the controller plugin ServiceAccount of every chart
# driver under both names it can have (the one this addon pins and the chart
# default), the same derivation as the ClusterRole patches. A subject whose
# ServiceAccount does not exist is inert.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rook-ceph-csi-ctrlplugin-secrets
  namespace: rook-ceph
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - rook-csi-rbd-provisioner
      - rook-csi-cephfs-provisioner
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rook-ceph-csi-ctrlplugin-secrets
  namespace: rook-ceph
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rook-ceph-csi-ctrlplugin-secrets
subjects:
  - kind: ServiceAccount
    name: rook-ceph-rbd-csi-ceph-com-ctrlplugin-sa
    namespace: rook-ceph
  - kind: ServiceAccount
    name: rbd-csi-ceph-com-ctrlplugin-sa
    namespace: rook-ceph
  - kind: ServiceAccount
    name: rook-ceph-cephfs-csi-ceph-com-ctrlplugin-sa
    namespace: rook-ceph
  - kind: ServiceAccount
    name: cephfs-csi-ceph-com-ctrlplugin-sa
    namespace: rook-ceph
  - kind: ServiceAccount
    name: rook-ceph-nvmeof-csi-ceph-com-ctrlplugin-sa
    namespace: rook-ceph
  - kind: ServiceAccount
    name: nvmeof-csi-ceph-com-ctrlplugin-sa
    namespace: rook-ceph
  - kind: ServiceAccount
    name: nfs-csi-ceph-com-ctrlplugin-sa
    namespace: rook-ceph
