# Rook-Ceph operator (Helm) values — operator only.
crds:
  enabled: true

# CSI: RBD only for Phase 1. Enable CephFS later if RWX/shared storage is needed.
# NOTE — driver selection does NOT live here: the rook-ceph chart's 1.20 `csi`
# block only carries sidecar image pins + installCsiOperator (the pre-1.20
# enable*Driver / provisionerReplicas keys are GONE — grep-verified against the
# v1.20.1 AND v1.20.6 chart values; helm silently ignored them). Which drivers
# exist (rbd on, cephfs/nfs/nvmeof off) and the plugin topology are set in
# csi-drivers.yaml (`drivers.*`), rendered by the ceph-csi-operator.

# We pin devices via per-node deviceFilter in cluster.yaml — no discovery daemon.
enableDiscoveryDaemon: false

logLevel: INFO

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
