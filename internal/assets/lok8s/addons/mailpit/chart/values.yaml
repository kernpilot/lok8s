# Chart fallback defaults. The ADDON-level values.yaml (loaded as a khelm
# valueFile, and the inline-override surface) carries the real route config; the
# values here are the conservative standalone defaults so a bare `helm template`
# of ./chart is valid and renders the workload WITHOUT a route.
image:
  repository: axllent/mailpit
  # Pinned by digest: the tag, then the digest of its multi-arch image index.
  # The chart renders `<repository>:<tag>`, and the container runtime pulls by
  # the digest. The tag is for the reader. On a bump, change the tag AND the
  # digest here, and appVersion in Chart.yaml. A mirror that you set through
  # image.repository must hold the image with this digest; for another image,
  # set image.tag too.
  tag: v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

# Route OFF by default at the chart level — exposing the UI is opt-in and needs
# a host + gateway, which the addon values.yaml supplies.
route:
  enabled: false
  host: ""
  # The Gateway the HTTPRoute attaches to, and the namespace the route lives in
  # (must match the Gateway's allowedRoutes). namespace "" => the route's own ns.
  namespace: default
  gateway:
    name: ""
    namespace: default
    sectionName: https
