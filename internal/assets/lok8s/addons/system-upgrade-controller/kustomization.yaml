# system-upgrade-controller — Rancher's in-cluster OS patcher. A generic,
# reusable atom: bootstrap `system-upgrade-controller` by name to get the
# controller (chart @110.0.0). The controller creates its upgrade.cattle.io/v1
# Plan CRD itself when it starts; the chart ships no CRD.
#
# This addon is the generic CONTROLLER only (split the same way cnpg-operator is
# operator+CRD here, CRs in the consumer). The cluster GLUE stays behind in the
# consuming cluster's glue target (./targets/system-upgrade-controller):
#   - the upgrade Plan(s) (which nodes to patch, the apt command, cordon/drain
#     policy, tolerations) — these are upgrade.cattle.io/v1 CRs whose CRD the
#     controller of THIS addon creates, so bootstrap this addon BEFORE that
#     glue target;
#   - the weekly trigger CronJob that bumps the Plans' version;
#   - the upgrade-Job ServiceAccount/RBAC the Plans reference (distinct from the
#     chart's own controller ServiceAccount).
#
# No `namespace:` transformer: it would move every namespaced object into
# cattle-system, and rbac.yaml needs one Role in `default` (the node events).
# The chart hardcodes cattle-system in every template, and rbac.yaml names
# the namespace of each object. TestSystemUpgradeControllerFixtureMatchesChart
# fails when a chart object comes without a namespace. We ship
# namespace.yaml here (the chart hardcodes the ns but does not create it) so the
# addon owns the controller's home namespace; the glue target's Plans/RBAC reuse
# it. (Unlike monitoring/tempo, the ns is NOT owned by a target here — the
# controller is the primary cattle-system tenant.)
#
# lok8s.dev labels are metadata-only (includeSelectors: false): the chart's
# Deployment carries an immutable selector, so the transformer must not touch it
# (else in-place re-applies / migrations from a target fail).
#
# RBAC: the chart binds the controller ServiceAccount to cluster-admin
# (ClusterRoleBinding system-upgrade-controller). The patch below deletes that
# binding from the render, and rbac.yaml grants what the controller calls.
# The bootstrap applies without prune, so a cluster that ran an earlier
# version of this addon keeps the old binding until you delete it once (the
# addons guide, section system-upgrade-controller). The opt-in addon
# system-upgrade-controller-cluster-admin restores the binding (not
# recommended).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: false
    pairs:
      lok8s.dev/name: system-upgrade-controller
      lok8s.dev/type: system
      lok8s.dev/category: infrastructure

generators:
  - chart.yaml

resources:
  - namespace.yaml
  - rbac.yaml

patches:
  # With a target the delete is a no-op when the binding is absent (a render
  # of the fixture alone); without one kustomize fails on the missing object.
  - target:
      kind: ClusterRoleBinding
      name: ^system-upgrade-controller$
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: system-upgrade-controller
