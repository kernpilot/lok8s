# khelm chart spec for Cilium.
# Pinned to a known-working version; bump deliberately, not on every chart release.
apiVersion: khelm.mgoltzsche.github.com/v2
kind: ChartRenderer
metadata:
  name: cilium
  namespace: kube-system
# kubeVersion must be set explicitly so khelm passes it to helm — otherwise
# helm defaults to v1.20.0 and the chart's `kubeVersion: '>= 1.21.0-0'` floor
# (unchanged between cilium chart 1.19.2 and 1.20.4) rejects it.
# The value also drives the chart's Capabilities gates: >= 1.27 (policy/v1
# PodDisruptionBudget) and >= 1.33 (explicit `hostUsers: true` on host-network
# pods — matches the apiserver default; the field is accepted from k8s 1.30).
# Track the kindest/node line current clusters run (.spec.kubernetes.version
# in the cluster spec); a cluster older than this pin only gains the explicit
# hostUsers field, a cluster newer than it only loses it — both harmless.
kubeVersion: "1.35.5"
# `upgradeCompatibility` is deliberately UNSET, and that is a standing choice,
# not an oversight: lok8s renders are stateless, so every render takes the
# chart's new-install defaults — each upstream default flip lands silently on
# the next bump instead of waiting behind a compatibility pin. The 1.20 bump
# accepted `envoy-xds-mode: ads` this way. 1.20.4 removes that default again
# (cilium/cilium#48548, agent CPU under identity churn): the render drops the
# key and the agent uses `split`. Keep it unset; do not pin `ads`. During a
# rolling upgrade the agent and cilium-envoy DaemonSets roll independently,
# so a node can briefly pair an envoy and an agent in different xDS modes,
# and inversely on rollback; envoy retries, the mismatch is per-node and
# bounded by the rollout, and it degrades only L7-proxy features (this addon
# ships no L7 policies). Re-check this trade on every bump: if a flip is not
# safe to take mid-rollout, pin the OLD behavior in values.yaml for one
# release instead of setting upgradeCompatibility.
# 1.20.4 (2026-10-30): 1.20.1 does not start on host kernel 7.2. Its BPF
# helper probe fails ("FnSetRetval … bpf_set_retval#187: R1 is not a scalar",
# cilium/cilium#48016). 1.20.2 has the fix (backport #48213 of #47737). A kind
# cluster runs on the host kernel, so a host update alone broke kubehz-dev.
# 1.20.4 rather than 1.20.2 or 1.20.3: it also fixes the 1.20.3 Gateway API
# BackendTLSPolicy regression and is a security release (Go 1.26.10). Open
# upstream since 1.20.2: socket-LB fails on kernels without BTF
# (cilium/cilium#48778). The kubehz-dev host kernel has BTF (checked
# 2026-10-30); check /sys/kernel/btf/vmlinux on any new node kernel.
repository: https://helm.cilium.io/
chart: cilium
version: 1.20.4
valueFiles:
  - values.yaml
