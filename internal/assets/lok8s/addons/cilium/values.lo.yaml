# Cilium values for Lo (kind) clusters.
#
# Kind-specific requirements:
#   1. ipam.mode: cluster-pool — kind doesn't provide pre-allocated per-node PodCIDR
#   2. routingMode: tunnel — kind nodes are containers on a Docker bridge,
#      no L3 routable infrastructure for native routing
#   3. Explicit clusterPoolIPv4PodCIDRList matching the kind cluster's podSubnet

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16
    # The service CIDR (10.96.0.0/12, kind's serviceSubnet) is the
    # apiserver's, not a cilium knob — a `clusterPoolIPv4ServiceCIDR` key
    # sat here until the 1.20.1 bump audit found it absent from BOTH the
    # 1.19.2 and 1.20.1 chart schemas: helm ignores unknown keys, so it
    # never rendered anything. Removed as a no-op.
    # /24 (~254 pod IPs/node) is intentional dev drift from prod's /23
    # (values.hetzner.yaml): kind/dev runs a handful of pods on 1-2 nodes with
    # no hosted-CP density pressure, so the extra IPs the /23 buys on Hetzner
    # aren't needed here. Kept explicit so the difference reads as a deliberate
    # per-environment choice, not accidental drift.
    clusterPoolIPv4MaskSize: 24

routingMode: tunnel
