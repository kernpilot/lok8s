# The agent's identity: the agent-token A and the claim-code C. The deploy
# creates this Secret empty, and the CronJob's bootstrap fills it once with
# a patch (see the kubehz-agent-secret Role in rbac.yaml). The agent has no
# create on Secrets: RBAC cannot limit a create to one name.
#
# The manifest has no data. `kubectl apply` of this file keeps the values
# that the agent wrote: it removes only what an earlier apply set. On an
# upgrade from a deploy whose agent created the Secret itself, the apply
# adds the labels and keeps the values. A GitOps controller must create
# this Secret only (see the guide): a reset empties it, the next tick mints
# a new A and C, and the platform no longer knows the cluster's identity.
apiVersion: v1
kind: Secret
metadata:
  name: kubehz-agent
  namespace: kubehz-system
  labels:
    app.kubernetes.io/name: kubehz-agent
    app.kubernetes.io/part-of: kubehz
type: Opaque
