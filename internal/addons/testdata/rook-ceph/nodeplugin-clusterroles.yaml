# Fixture for internal/addons/rookceph_rbac_test.go: the Ceph CSI node plugin
# ClusterRoles exactly as the ceph-csi-drivers chart renders them for the
# rook-ceph addon (driver names rook-ceph.rbd.csi.ceph.com and
# rook-ceph.cephfs.csi.ceph.com), BEFORE the addon's least-privilege patches.
# The test runs the addon's real `patches:` block over this file.
#
# chart: ceph-csi-drivers 1.0.4
#
# Produced from a copy of internal/assets/lok8s/addons/rook-ceph with the
# `patches:` block removed and `drivers.cephfs.enabled: true` in
# csi-drivers.yaml:
#   KUSTOMIZE_PLUGIN_HOME=$PWD/.kustomize KHELM_TRUST_ANY_REPO=true \
#     .bin/kustomize build --enable-alpha-plugins --enable-exec <copy>
# then the two *-nodeplugin-cr ClusterRoles, metadata reduced to the name,
# sorted by name. Refresh it on every ceph-csi-drivers version bump (the test
# fails while the `chart:` line above and csi-drivers.yaml disagree) and
# re-check the patch indices against the new rule order.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rook-ceph-cephfs-csi-ceph-com-nodeplugin-cr
rules:
  - apiGroups:
      - ''
    resources:
      - nodes
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - serviceaccounts
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - serviceaccounts/token
    verbs:
      - create
  - apiGroups:
      - ''
    resources:
      - events
    verbs:
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ''
    resources:
      - persistentvolumes
      - persistentvolumeclaims
    verbs:
      - get
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
---
