# Fixture for internal/addons/rookceph_rbac_test.go: the Ceph CSI controller
# plugin ClusterRoles exactly as the ceph-csi-drivers chart renders them,
# BEFORE the rook-ceph addon's least-privilege patches, for every chart driver
# (rbd, cephfs, nfs, nvmeof) under both names each can have: the name the
# addon pins in csi-drivers.yaml (rook-ceph.<type>.csi.ceph.com) and the chart
# default (<type>.csi.ceph.com; nfs is not pinned, so it has one name). The
# test runs the addon's real `patches:` block over this file and compares the
# roles as whole objects; TestRookCephFixturesMatchChart re-renders the chart
# (on CI, or LOK8S_ONLINE_TESTS=1) and fails on any drift from it.
#
# chart: ceph-csi-drivers 1.0.4
#
# Produced exactly like nodeplugin-clusterroles.yaml (see its header), taking
# every *-ctrlplugin-cr ClusterRole instead. Refresh both files together on
# every ceph-csi-drivers version bump and re-check the patch indices against
# the new rule order.
