# The Plan of the suc scenario, and the Secret it mounts. The test applies
# both when the controller is Available and its Plan CRD is Established,
# as a consumer's own target would.
#
# Each field below uses one part of the addon's narrowed RBAC:
#   - serviceAccountName system-upgrade-controller: the Job runs as the
#     controller's own ServiceAccount, the one that the ClusterRole
#     lok8s-system-upgrade-controller-drainer is bound to;
#   - cordon and drain: the Job's drain container (the pinned kubectl
#     image) cordons the node and evicts its pods (nodes get, patch; pods
#     list, get; pods/eviction create; daemonsets get);
#   - secrets: the controller reads the Secret from its cache, and the
#     upgrade container reads the mounted file;
#   - when the Job completes, the controller writes the Plan status, puts
#     the Plan label on the node and makes the node schedulable again.
#
# The cluster has one node. The pods that the drain evicts wait as Pending
# until the controller makes the node schedulable again.
apiVersion: v1
kind: Secret
metadata:
  name: e2e-suc-plan
  namespace: cattle-system
type: Opaque
stringData:
  marker: e2e-suc-secret
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: e2e-suc
  namespace: cattle-system
spec:
  concurrency: 1
  nodeSelector:
    matchExpressions:
      - {key: kubernetes.io/os, operator: In, values: [linux]}
  serviceAccountName: system-upgrade-controller
  cordon: true
  drain:
    force: true
    deleteEmptydirData: true
    # The drain stops waiting for a deleted pod after 60 s. A pod that
    # cannot move to another node does not hold it for ever.
    skipWaitForDeleteTimeout: 60
  secrets:
    - name: e2e-suc-plan
      path: /run/e2e-suc
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # The test sets the version to e2e-2 after the controller restart. A new
  # version is a new hash, so the controller runs the Plan again.
  version: e2e-1
  upgrade:
    # Pinned by digest, like the two images of the addon.
    image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    command: [/bin/sh, -c]
    args:
      - test "$(cat /run/e2e-suc/marker)" = e2e-suc-secret && echo "e2e-suc: the Plan Secret is mounted"
