apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubehz-agent
  labels:
    app.kubernetes.io/name: kubehz-agent
    app.kubernetes.io/part-of: kubehz
rules:
  # nodes: the heartbeat's one node list, and the control-plane count of
  # the assessment. The agent reads no other core resource cluster-wide
  # except the assessment probes below. `list` only, here and for the CSRs,
  # storageclasses and persistentvolumes: every call of the script on them
  # is a list (`get --raw /api/v1/nodes`, `get <kind> -o json`, `get nodes
  # -l …`), and none reads one object by name.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
  - apiGroups:
      - certificates.k8s.io
    resources:
      - certificatesigningrequests
    verbs:
      - list
  # Assessment probes (handover contract §1), read-only: list, and one get:
  #   storageclasses          → storageClasses[] (name/provisioner/isDefault)
  #   persistentvolumes       → pvSummary (count + Gi grouped by provisioner)
  #   services (cluster-wide) → loadBalancers count (type=LoadBalancer)
  #   webhookconfigurations   → webhooks.validating/mutating counts
  #   the CAPI CRD            → capiManaged presence probe; `get` is
  #     resourceNames-scoped to clusters.cluster.x-k8s.io — the agent can
  #     read no other CRD and cannot enumerate them.
  # nodes list (cpUsage counts) is already granted above.
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - persistentvolumes
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - list
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
    verbs:
      - list
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    resourceNames:
      - clusters.cluster.x-k8s.io
    verbs:
      - get
  # Heartbeat components[]: apiserver/etcd health via
  # `kubectl get --raw /readyz?verbose` (+ /version as the reachability
  # fallback). Read-only, and normally already granted by the default
  # system:public-info-viewer binding — declared explicitly so the probes
  # keep working on hardened clusters that prune the default bindings.
  - nonResourceURLs:
      - /readyz
      - /version
    verbs:
      - get
---
# Heartbeat components[]: scheduler/controller-manager health is derived from
# the static pods' Ready condition. Namespaced Role (not ClusterRole): the
# agent only ever reads pods in kube-system — no cluster-wide pod access.
# `list` only: the probe is a label-selector `kubectl get pods -l …`, which is
# a LIST call — the agent never GETs a pod by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubehz-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kubehz-agent
    app.kubernetes.io/part-of: kubehz
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
  # Assessment probes (handover contract §1), kube-system only:
  #   daemonsets       → CNI guess (cilium/calico/flannel/kube-proxy-only)
  #   kubeadm-config   → pod/service CIDR; `get` is resourceNames-scoped to
  #     that ONE ConfigMap — no other kube-system ConfigMap is readable.
  - apiGroups:
      - apps
    resources:
      - daemonsets
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - kubeadm-config
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubehz-agent
  labels:
    app.kubernetes.io/name: kubehz-agent
    app.kubernetes.io/part-of: kubehz
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubehz-agent
subjects:
  - kind: ServiceAccount
    name: kubehz-agent
    namespace: kubehz-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubehz-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kubehz-agent
    app.kubernetes.io/part-of: kubehz
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubehz-agent
subjects:
  - kind: ServiceAccount
    name: kubehz-agent
    namespace: kubehz-system
---
# Agent-identity bootstrap (P0 self-hosted claim). The heartbeat CronJob
# generates the agent-token (A) + claim-code (C) into Secret kubehz-agent and
# reads A back to authenticate its heartbeat. Namespaced Role in kubehz-system,
# with one rule: `get` and `patch`, scoped by resourceNames to that one Secret.
# The agent reads A/C back but CANNOT read or change any OTHER Secret in the
# namespace (Kubernetes RBAC honors resourceNames for get and patch).
# No `create`: RBAC cannot limit a create to one name (an object has no name
# before it exists), so a create rule would let the holder of this token make
# a Secret of any name in kubehz-system. The deploy creates kubehz-agent empty
# (identity-secret.yaml), and the bootstrap fills it with one patch.
# No update or delete. The patch can change the Secret, so RBAC alone no longer
# keeps A and C from rotating. The script keeps them: it patches only a Secret
# that holds neither key, and the patch carries the resourceVersion that its
# read saw, so the apiserver refuses it when the Secret changed in between.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubehz-agent-secret
  namespace: kubehz-system
  labels:
    app.kubernetes.io/name: kubehz-agent
    app.kubernetes.io/part-of: kubehz
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - kubehz-agent
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubehz-agent-secret
  namespace: kubehz-system
  labels:
    app.kubernetes.io/name: kubehz-agent
    app.kubernetes.io/part-of: kubehz
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubehz-agent-secret
subjects:
  - kind: ServiceAccount
    name: kubehz-agent
    namespace: kubehz-system
---
# Agent state (handover contract §1). The CronJob pod is ephemeral, so its
# markers persist as annotations on the kubehz-agent-state ConfigMap
# (state-configmap.yaml): the "sent at most once per 24h / send-on-request"
# assessment gate (kubehz.cloud/last-assessment, kubehz.cloud/assess-requested),
# the claim nonce that `lo kubehz claim` places, and the desired-state
# validator. get+patch only, BOTH resourceNames-scoped to that single
# ConfigMap (both verbs honor resourceNames): the agent can annotate nothing
# else and cannot create/update/delete any ConfigMap. The agent's
# configuration (kubehz-agent-config: the API URL, the cluster id, the
# heartbeat owner) is a separate ConfigMap, and no rule here names it: the
# pod gets its keys through envFrom, which the kubelet reads, so the agent
# cannot read or change its configuration through the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubehz-agent-marker
  namespace: kubehz-system
  labels:
    app.kubernetes.io/name: kubehz-agent
    app.kubernetes.io/part-of: kubehz
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - kubehz-agent-state
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubehz-agent-marker
  namespace: kubehz-system
  labels:
    app.kubernetes.io/name: kubehz-agent
    app.kubernetes.io/part-of: kubehz
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubehz-agent-marker
subjects:
  - kind: ServiceAccount
    name: kubehz-agent
    namespace: kubehz-system
