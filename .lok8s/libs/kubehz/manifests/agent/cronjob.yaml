apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubehz-heartbeat
  namespace: kubehz-system
  labels:
    app.kubernetes.io/name: kubehz-agent
    app.kubernetes.io/part-of: kubehz
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: kubehz-heartbeat
            app.kubernetes.io/name: kubehz-agent
            app.kubernetes.io/part-of: kubehz
        spec:
          serviceAccountName: kubehz-agent
          restartPolicy: Never
          containers:
            - name: heartbeat
              # alpine/k8s carries a shell + bash/curl/kubectl/sha256sum/coreutils,
              # which the bootstrap + heartbeat script needs. The previous
              # registry.k8s.io/kubectl image is DISTROLESS (no shell) — the script
              # could never run on it. Pinned by digest (supply chain). No openssl
              # in-image, so rand_hex uses the /dev/urandom fallback (verified).
              image: alpine/k8s:1.31.4@sha256:9c4976d47656d78cf53a92b0203fc54ac45eae18a2b45001ac221c27da4c8036
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  # ── Agent identity: self-generated, create-if-absent, NEVER rotated ──
                  # One Secret (kubehz-system/kubehz-agent) holds two 256-bit values:
                  #   agent-token A = khz_agt_<hex32> — the live heartbeat credential,
                  #     sent as `Authorization: Bearer A`. It NEVER transits a browser
                  #     and is NEVER printed by any command (no lo subcommand emits it).
                  #   claim-code  C = khzc_<hex32>  — the one-time proof the user pastes
                  #     into the dashboard /claim page (`lo kubehz claim-code`).
                  # The platform stores only sha256(A)/sha256(C) and can never push a
                  # credential inward. Generated once and idempotently reused: a re-run
                  # NEVER rotates (rotating A breaks heartbeats; rotating C breaks a
                  # claim the user may already hold).
                  rand_hex() {
                    if command -v openssl >/dev/null 2>&1; then
                      openssl rand -hex 32
                    else
                      od -An -N32 -tx1 /dev/urandom | tr -d ' \n'
                    fi
                  }
                  sha256_hex() {
                    if command -v sha256sum >/dev/null 2>&1; then
                      sha256sum | cut -d' ' -f1
                    else
                      openssl dgst -sha256 | awk '{print $NF}'
                    fi
                  }

                  if ! kubectl get secret kubehz-agent -n kubehz-system >/dev/null 2>&1; then
                    NEW_A="khz_agt_$(rand_hex)"
                    NEW_C="khzc_$(rand_hex)"
                    # create-if-absent; tolerate a concurrent creator so we never rotate.
                    kubectl create secret generic kubehz-agent -n kubehz-system \
                      --from-literal=agent-token="${NEW_A}" \
                      --from-literal=claim-code="${NEW_C}" >/dev/null 2>&1 || true
                    NEW_A=""
                    NEW_C=""
                  fi

                  # Always read the authoritative values back from the Secret (not the
                  # just-generated ones), so a concurrent creator's values win — no
                  # rotation, ever. The Secret is the single source of truth for A and C.
                  AGENT_TOKEN=$(kubectl get secret kubehz-agent -n kubehz-system \
                    -o jsonpath='{.data.agent-token}' 2>/dev/null | base64 -d)
                  CLAIM_CODE=$(kubectl get secret kubehz-agent -n kubehz-system \
                    -o jsonpath='{.data.claim-code}' 2>/dev/null | base64 -d)

                  # ── Self-register: POST {domain, sha256(A), sha256(C)} — HASHES ONLY ──
                  # Idempotent by (domain, sha256(A)) server-side, so re-asserting every
                  # tick is safe. Best-effort: a failure never aborts the heartbeat (the
                  # next tick retries). Only hashes leave the cluster — never A or C in
                  # the clear.
                  if [ -n "${AGENT_TOKEN}" ] && [ -n "${CLAIM_CODE}" ]; then
                    AGENT_TOKEN_HASH=$(printf %s "${AGENT_TOKEN}" | sha256_hex)
                    CLAIM_CODE_HASH=$(printf %s "${CLAIM_CODE}" | sha256_hex)
                    REGISTER_PAYLOAD=$(printf \
                      '{"domain":"%s","agentTokenHash":"%s","claimCodeHash":"%s"}' \
                      "${CLUSTER_ID}" "${AGENT_TOKEN_HASH}" "${CLAIM_CODE_HASH}")
                    curl -fsSL -X POST "${KUBEHZ_API_URL}/api/clusters/agent-register" \
                      -H "Content-Type: application/json" \
                      -d "${REGISTER_PAYLOAD}" >/dev/null 2>&1 \
                      || echo "kubehz: agent-register attempt failed; retrying next tick" >&2
                  fi
                  # C stayed in memory only to compute its hash above; drop it now.
                  CLAIM_CODE=""

                  # kubernetesVersion = the SERVER version. The apiserver
                  # /version endpoint returns a single-object JSON with exactly
                  # one "gitVersion", so this extraction is unambiguous. NOTE:
                  # `kubectl version -o json` carries BOTH clientVersion and
                  # serverVersion — a first-match `sed … | head -1` grabbed the
                  # CLIENT (= the kubectl image tag, v1.31.x), reporting the wrong
                  # version for every cluster. `kubectl version -o jsonpath=…` is
                  # NOT usable: kubectl rejects it (`--output must be 'yaml' or
                  # 'json'`). /version is already reachable (used as the apiserver
                  # health fallback below), so no extra RBAC is needed.
                  KUBE_VERSION=$(kubectl get --raw /version 2>/dev/null | \
                    sed -n 's/.*"gitVersion": *"\([^"]*\)".*/\1/p' | head -1)

                  # Node NAMES only, via a targeted jsonpath over
                  # .items[].metadata.name. A greedy `get nodes -o json | sed
                  # 's/.*"name":"…"/…/'` ALSO scrapes .status.runtimeHandlers[].name
                  # (e.g. "runc"/"crun", present on k8s ≳1.27) and
                  # .status.volumesAttached[].name (CSI handles) — the loop then
                  # runs `kubectl get node runc`, which NotFounds, and `set -e`
                  # kills the whole heartbeat before it ever POSTs.
                  NODES=$(kubectl get nodes \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | head -20)

                  # Per-node payload. instanceType mirrors the well-known
                  # node.kubernetes.io/instance-type label (set by the cloud
                  # provider, e.g. Hetzner CCM: cx32/cpx41/…) — it powers the
                  # self-hosted price overview in the dashboard. Fail-soft: a
                  # missing label (bare metal, kind, no CCM) yields "" and the
                  # heartbeat never fails because of it.
                  NODE_ARRAY="["
                  first=true
                  for node in ${NODES}; do
                    status=$(kubectl get node "${node}" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
                    # roles: control-plane iff the node carries the
                    # node-role.kubernetes.io/control-plane (or legacy /master)
                    # LABEL KEY. Those labels have an EMPTY value, so a per-key
                    # jsonpath returns "" (exit 0) whether the label is present or
                    # ABSENT — the old `… && echo control-plane` thus fired for
                    # EVERY node. Test the key's presence in the rendered labels
                    # map instead (jsonpath prints it as JSON on the pinned
                    # kubectl); default worker. Fail-soft under set -e.
                    labels=$(kubectl get node "${node}" -o jsonpath='{.metadata.labels}' 2>/dev/null) || labels=""
                    case "${labels}" in
                      *'"node-role.kubernetes.io/control-plane"'*|*'"node-role.kubernetes.io/master"'*) roles="control-plane" ;;
                      *) roles="worker" ;;
                    esac
                    itype=$(kubectl get node "${node}" -o jsonpath='{.metadata.labels.node\.kubernetes\.io/instance-type}' 2>/dev/null) || itype=""
                    if [ "${first}" = "true" ]; then first=false; else NODE_ARRAY="${NODE_ARRAY},"; fi
                    NODE_ARRAY="${NODE_ARRAY}{\"name\":\"${node}\",\"status\":\"${status}\",\"roles\":\"${roles}\",\"instanceType\":\"${itype}\"}"
                  done
                  NODE_ARRAY="${NODE_ARRAY}]"

                  CERT_EXPIRY=$(kubectl get csr -o json 2>/dev/null | \
                    sed -n 's/.*"expirationTimestamp": *"\([^"]*\)".*/\1/p' | \
                    sort | head -1)
                  [ -z "${CERT_EXPIRY}" ] && CERT_EXPIRY="unknown"

                  # Control-plane component health. Fail-soft: every probe is
                  # guarded, and a failed probe OMITS its component — the
                  # heartbeat itself must never fail because a probe did.
                  # /readyz?verbose serves two probes at once: the overall
                  # result -> apiserver, the per-check lines -> etcd. 2>&1 on
                  # purpose: on HTTP 500 kubectl embeds the [+]/[-] check lines
                  # in its error text, which is exactly what we parse.
                  READYZ=$(kubectl get --raw '/readyz?verbose' 2>&1) && READYZ_OK=true || READYZ_OK=false

                  APISERVER_STATUS=""
                  if [ "${READYZ_OK}" = "true" ]; then
                    APISERVER_STATUS="Healthy"
                  else
                    case "${READYZ}" in
                      *"[-]"*) APISERVER_STATUS="Unhealthy" ;;
                      *) kubectl get --raw /version >/dev/null 2>&1 && APISERVER_STATUS="Healthy" || true ;;
                    esac
                  fi

                  ETCD_STATUS=""
                  case "${READYZ}" in
                    *"[-]etcd"*) ETCD_STATUS="Unhealthy" ;;
                    *"[+]etcd ok"*) ETCD_STATUS="Healthy" ;;
                  esac

                  COMPONENTS=""
                  if [ -n "${APISERVER_STATUS}" ]; then
                    COMPONENTS="{\"name\":\"apiserver\",\"status\":\"${APISERVER_STATUS}\"}"
                  fi
                  if [ -n "${ETCD_STATUS}" ]; then
                    if [ -n "${COMPONENTS}" ]; then COMPONENTS="${COMPONENTS},"; fi
                    COMPONENTS="${COMPONENTS}{\"name\":\"etcd\",\"status\":\"${ETCD_STATUS}\"}"
                  fi

                  # scheduler/controller-manager from the kube-system static
                  # pods. No matching pods (managed/external control plane) ->
                  # omit the component rather than report a false Unhealthy.
                  for comp in kube-scheduler kube-controller-manager; do
                    ready=$(kubectl get pods -n kube-system -l "component=${comp}" \
                      -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{" "}{end}' 2>/dev/null) || ready=""
                    cstatus=""
                    case "${ready}" in
                      *True*) cstatus="Healthy" ;;
                      ?*) cstatus="Unhealthy" ;;
                    esac
                    if [ -n "${cstatus}" ]; then
                      if [ -n "${COMPONENTS}" ]; then COMPONENTS="${COMPONENTS},"; fi
                      COMPONENTS="${COMPONENTS}{\"name\":\"${comp#kube-}\",\"status\":\"${cstatus}\"}"
                    fi
                  done
                  COMPONENT_ARRAY="[${COMPONENTS}]"

                  PAYLOAD=$(cat <<PAYLOAD_EOF
                  {
                    "clusterId": "${CLUSTER_ID}",
                    "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "kubernetes": { "version": "${KUBE_VERSION}" },
                    "nodes": ${NODE_ARRAY},
                    "components": ${COMPONENT_ARRAY},
                    "certificates": { "expiresAt": "${CERT_EXPIRY}" }
                  }
                  PAYLOAD_EOF
                  )

                  # Authenticated heartbeat: the agent-token (A) proves this beat
                  # is the cluster's real, enrolled identity — the platform's
                  # ratchet 401s an anonymous/invalid beat once a token exists.
                  # Guard an empty A (the Secret read failed this tick): a blank
                  # bearer is guaranteed to 401, so skip the POST and let the next
                  # tick retry once the Secret is readable (fail-soft, exit 0).
                  if [ -z "${AGENT_TOKEN}" ]; then
                    echo "kubehz: agent-token unavailable; skipping heartbeat (retrying next tick)" >&2
                    exit 0
                  fi
                  curl -fsSL -X POST "${KUBEHZ_API_URL}/api/clusters/${CLUSTER_ID}/heartbeat" \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer ${AGENT_TOKEN}" \
                    -d "${PAYLOAD}"
              envFrom:
                - configMapRef:
                    name: kubehz-agent-config
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - ALL
