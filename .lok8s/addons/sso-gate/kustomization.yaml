# sso-gate — put any HTTP service behind OIDC single sign-on at the gateway.
#
# A generic, reusable atom in the oidc-rbac mold: bootstrap `sso-gate` by name
# and any HTTPRoute you label `sso.lok8s.dev/protect: "true"` starts requiring
# an OIDC login BEFORE traffic reaches the service — no sidecar, no app change.
# Envoy Gateway's SecurityPolicy runs the whole flow (redirect to the issuer,
# callback, session cookie, token validation) inside the gateway listener.
#
# Enforcement is a POLICY ATTACHMENT: routes without the label stay public.
# Removing the label (or deleting this addon) makes the route public again;
# the route object itself never changes shape.
#
# ── SSO ADDS, it does not REPLACE (mergeType — read this one) ────────────────
# The shipped policy sets `mergeType: StrategicMerge`, and that single field is
# the difference between "this route now needs a login" and "this route now
# needs a login INSTEAD of everything else that guarded it".
#
# Envoy Gateway resolves overlapping SecurityPolicies by SPECIFICITY: the most
# specific one wins ENTIRELY. A policy on an HTTPRoute therefore replaces the
# policy on that route's Gateway — not field by field, wholesale. If your
# Gateway carries an IP allowlist, an `authorization` deny-by-default, JWT or
# CORS, an unmerged sso-gate DELETES all of it for every route you label. The
# route ends up more reachable than it was before you protected it, and the
# only signal is an `Overridden: True` status condition on the Gateway policy —
# listing the routes it lost, where nobody looks.
#
# `mergeType: StrategicMerge` merges this policy INTO the Gateway's instead, so
# a labelled route keeps the gateway-wide guards and gains OIDC on top. It is
# legal only on a policy targeting a CHILD resource (HTTPRoute/GRPCRoute/
# TCPRoute) — Envoy Gateway rejects it on a Gateway or listener target — which
# is exactly this addon's shape.
#
# When the merge takes effect, the Gateway policy stops listing the route under
# `Overridden` and lists it under `Merged` instead — that swap is the cheapest
# confirmation. (Read the generated Envoy config for the real proof: the route
# must carry BOTH `envoy.filters.http.rbac` and the oauth2 filter. Envoy runs
# oauth2 FIRST, so a blocked client is redirected to the issuer and refused
# after it returns — gated, but no longer hidden.)
#
# Requires the `envoy-gateway` addon at **v1.8.0 or later**. Older CRDs have no
# such field, and the failure differs by apply mode: a SERVER-SIDE apply (this
# framework's `kapply`, and every GitOps controller) is REJECTED with
# `.spec.mergeType: field not declared in schema`, while a client-side apply
# drops it silently and leaves the replace behaviour above. Upgrade
# envoy-gateway BEFORE this policy reconciles, or the whole apply set fails.
#
# ── Requirements ──────────────────────────────────────────────────────────────
#   - the `envoy-gateway` addon at v1.8.0+ (SecurityPolicy is its CRD, and
#     `mergeType` needs 1.8; any OIDC issuer works)
#   - a client registered at your issuer with redirect URI
#       https://<each-protected-host>/oauth2/callback
#   - a Secret `sso-gate-client` (key `client-secret`) NEXT TO the policy —
#     i.e. in this addon's namespace (see below). Use the secrets plugin:
#       apiVersion: secrets.lok8s.dev/v1
#       kind: Secret
#       metadata: { name: sso-gate-client, namespace: default }
#       env: { client-secret: SSO_GATE_CLIENT_SECRET }
#
# ── Namespacing (the one sharp edge) ─────────────────────────────────────────
# `targetSelectors` only matches HTTPRoutes in the SAME namespace as the
# SecurityPolicy. This addon ships the policy in `default` (where a stock
# lok8s gateway target puts its routes). Routes in another namespace need
# their own copy — layer it from a target:
#
#   apiVersion: kustomize.config.k8s.io/v1beta1
#   kind: Kustomization
#   namespace: my-apps
#   resources: [<lok8s>/.lok8s/addons/sso-gate]
#
# ── Configuring the issuer (REQUIRED — patch BEFORE labeling routes) ─────────
# The shipped issuer/clientID are placeholders whose OIDC discovery can never
# succeed, so Envoy Gateway marks the policy not-Accepted at translation (EG
# has no admission webhook). UNLABELED routes are never affected — but a route
# that already carries the protect label while the policy is broken (bad
# issuer, missing sso-gate-client Secret) answers 500: the gate FAILS CLOSED,
# never open. Patch these from the consuming target (do NOT edit this addon):
#
#   patches:
#     - target: { kind: SecurityPolicy, name: sso-gate }
#       patch: |-
#         - op: replace
#           path: /spec/oidc/provider/issuer
#           value: "https://id.example.com"
#         - op: replace
#           path: /spec/oidc/clientID
#           value: "my-gateway-client"
#
# Works with ANY spec-compliant OIDC issuer (ZITADEL, Keycloak, authentik,
# Dex, ...). kubehz hosted clusters get this wired automatically by the
# kubehz operator instead of this addon.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: false
    pairs:
      lok8s.dev/name: sso-gate
      lok8s.dev/type: system
      lok8s.dev/category: security

resources:
  - securitypolicy.yaml
