# The single enforcement object: one SecurityPolicy per namespace, matching
# every HTTPRoute labeled sso.lok8s.dev/protect=true in that namespace.
# See kustomization.yaml for the REQUIRED issuer/clientID patch and the
# per-namespace layering pattern.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: sso-gate
  namespace: default
spec:
  # MERGE this policy into the Gateway's, do not REPLACE it. Load-bearing
  # security field, not a style choice — WITHOUT it, labeling a route for SSO
  # silently DELETES whatever the Gateway policy enforced on that route (IP
  # allowlist, `authorization` deny-by-default, JWT, CORS), leaving it MORE
  # reachable than before it was "protected". WITH it, a labeled route also
  # inherits those Gateway rules, so a route that answers 200 today can start
  # answering 403. Both directions, the full reasoning and how to verify the
  # merge on a live gateway: docs/guide/addons.md, "SSO must ADD to your
  # gateway's guards". Do not copy this field onto a gateway-wide policy —
  # Envoy Gateway accepts it only on an xRoute target, which is this addon's
  # only shape. (`JSONMerge` is the other legal value; "no merge" is spelled by
  # omitting the field, not by writing `Replace`.)
  mergeType: StrategicMerge
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      matchLabels:
        sso.lok8s.dev/protect: "true"
  oidc:
    provider:
      # PLACEHOLDER — patch from your consuming target (kustomization.yaml
      # header). `.invalid` is a reserved TLD (RFC 2606): it can never
      # resolve, so OIDC discovery fails at Envoy Gateway's TRANSLATION
      # step and the policy reports not-Accepted instead of half-working
      # against something unexpected. NOTE: routes that DO carry the
      # protect label while the policy is broken answer 500 (fail-closed)
      # — patch the issuer BEFORE labeling any route.
      issuer: https://sso-gate-unconfigured.invalid
    clientID: sso-gate-unconfigured
    clientSecret:
      # key `client-secret`; must live in this policy's namespace.
      name: sso-gate-client
    scopes:
      - openid
      - email
      # Ask for group claims so a follow-up `jwt` + `authorization` section
      # (role-gating) can act on them; harmless if the issuer has none.
      - groups
    # redirectURL/logoutPath deliberately NOT set: Envoy Gateway defaults to
    # https://<host>/oauth2/callback and /logout — register that callback at
    # the issuer for every protected host.
