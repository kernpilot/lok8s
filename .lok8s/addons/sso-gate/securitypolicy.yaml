# The single enforcement object: one SecurityPolicy per namespace, matching
# every HTTPRoute labeled sso.lok8s.dev/protect=true in that namespace.
# See kustomization.yaml for the REQUIRED issuer/clientID patch and the
# per-namespace layering pattern.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: sso-gate
  namespace: default
spec:
  # MERGE into the Gateway's policy, do not REPLACE it (Envoy Gateway v1.8+).
  #
  # Without this field a route-level SecurityPolicy replaces the Gateway-level
  # one WHOLESALE for every route it selects. So labelling a route for SSO also
  # silently drops whatever the Gateway policy enforced on it — an IP
  # allowlist, an `authorization` deny-by-default, JWT, CORS. The route becomes
  # MORE reachable than before you protected it, and Envoy Gateway reports the
  # loss only as an `Overridden: True` condition on the Gateway policy, which
  # nothing reads. (Measured, not theorised: an unmerged route policy stripped
  # a Gateway-level IP allowlist from one host and went unnoticed until someone
  # read the generated Envoy config and saw the RBAC filter missing from that
  # vhost alone, while every sibling still had it.)
  #
  # `StrategicMerge` merges this policy's fields into the parent instead: a
  # labelled route keeps the Gateway's authorization AND gains OIDC.
  # `JSONMerge` is the other accepted value (RFC 7386 — a `null` deletes the
  # parent's field). `Replace` is rejected by the CRD: "no merge" is spelled by
  # omitting the field, not by naming it.
  #
  # CONSTRAINT: mergeType is only legal on a policy targeting a CHILD resource
  # (HTTPRoute/GRPCRoute/TCPRoute) — there is no parent to merge into
  # otherwise, and Envoy Gateway rejects it on Gateway / Gateway-listener /
  # ListenerSet targets. This addon only ever targets HTTPRoutes, so it is
  # always legal here; do NOT copy the field onto a gateway-wide policy.
  #
  # Needs the envoy-gateway addon at v1.8.0 or later. On v1.7.x the field does
  # not exist in the CRD, and the failure differs by apply mode (measured):
  # a SERVER-SIDE apply — bootstrap's kapply, and every GitOps controller —
  # is REJECTED outright with `.spec.mergeType: field not declared in schema`,
  # while a client-side apply drops the field silently and leaves the replace
  # behaviour. So upgrade envoy-gateway BEFORE this policy reconciles.
  mergeType: StrategicMerge
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      matchLabels:
        sso.lok8s.dev/protect: "true"
  oidc:
    provider:
      # PLACEHOLDER — patch from your consuming target (kustomization.yaml
      # header). `.invalid` is a reserved TLD (RFC 2606): it can never
      # resolve, so OIDC discovery fails at Envoy Gateway's TRANSLATION
      # step and the policy reports not-Accepted instead of half-working
      # against something unexpected. NOTE: routes that DO carry the
      # protect label while the policy is broken answer 500 (fail-closed)
      # — patch the issuer BEFORE labeling any route.
      issuer: https://sso-gate-unconfigured.invalid
    clientID: sso-gate-unconfigured
    clientSecret:
      # key `client-secret`; must live in this policy's namespace.
      name: sso-gate-client
    scopes:
      - openid
      - email
      # Ask for group claims so a follow-up `jwt` + `authorization` section
      # (role-gating) can act on them; harmless if the issuer has none.
      - groups
    # redirectURL/logoutPath deliberately NOT set: Envoy Gateway defaults to
    # https://<host>/oauth2/callback and /logout — register that callback at
    # the issuer for every protected host.
