# khelm chart spec for Grafana Loki (SingleBinary mode) — the cluster log
# store, inflated via khelm at kustomize build time.
#
# This is the upstream `loki` chart pinned to its SingleBinary deployment
# mode (values.yaml) — NOT loki-distributed. One StatefulSet, filesystem
# chunk storage on a PVC. Sized as a per-cluster operations log store
# (incident forensics, alert/trace correlation), not compliance archival.
#
# The ChartRenderer `metadata.name` is used by khelm as the Helm RELEASE
# name, so it prefixes every generated resource and is also the Service
# name. We pin it to `loki` so the Service is deterministically
# `loki.monitoring:3100` (the Grafana datasource URL and promtail's push
# target). Do not rename without updating both consumers.
#
# TERMINAL LINEAGE — this pin is on a chart line we are not the audience for.
# As of 2026-03-16 `charts/loki/` in grafana/helm-charts holds no chart at
# all: the directory was wiped down to a README pointing at
# grafana-community/helm-charts (same as `charts/tempo/`). What still
# publishes under 7.x is the Grafana Enterprise Logs line. The OSS chart
# forked to the community repo at 6.55.0 and renumbered from there — it is
# past 18.x now, so the two lines' version strings COLLIDE and "bump loki"
# is ambiguous between two different charts.
#
# The pin renders correctly today: 7.x still ships the SingleBinary
# templates we use, and still moves the OSS image incidentally. But it moves
# it late — this pin renders loki 3.6.11 while the community chart is on
# 3.7.6 — and it will keep drifting, because bumping OSS is not that line's
# purpose. Migrating is an explicit repository + version switch with a
# re-validation of every value we set, so it cannot ride along in a pin
# bump. Tracked in kernpilot/lok8s#146 — do not bump this pin again without
# reading it.
apiVersion: khelm.mgoltzsche.github.com/v2
kind: ChartRenderer
metadata:
  name: loki
  namespace: monitoring
kubeVersion: "1.35.5"
# khelm renders OFFLINE: the chart gates its ServiceMonitor on
# Capabilities.APIVersions, which is empty without this — the monitor would
# silently vanish from the render (metrics unscraped, everything green).
apiVersions:
  - monitoring.coreos.com/v1/ServiceMonitor
repository: https://grafana.github.io/helm-charts
chart: loki
version: 7.3.0
valueFiles:
  - values.yaml
