# khelm chart spec for Cilium.
# Pinned to a known-working version; bump deliberately, not on every chart release.
apiVersion: khelm.mgoltzsche.github.com/v2
kind: ChartRenderer
metadata:
  name: cilium
  namespace: kube-system
# kubeVersion must be set explicitly so khelm passes it to helm — otherwise
# helm defaults to v1.20.0 and the chart's `kubeVersion: '>= 1.21.0-0'` floor
# (unchanged between cilium chart 1.19.2 and 1.20.1) rejects it.
# The value also drives the chart's Capabilities gates: >= 1.27 (policy/v1
# PodDisruptionBudget) and >= 1.33 (explicit `hostUsers: true` on host-network
# pods — matches the apiserver default; the field is accepted from k8s 1.30).
# Track the kindest/node line current clusters run (.spec.kubernetes.version
# in the cluster spec); a cluster older than this pin only gains the explicit
# hostUsers field, a cluster newer than it only loses it — both harmless.
kubeVersion: "1.35.5"
# `upgradeCompatibility` is deliberately UNSET, and that is a standing choice,
# not an oversight: lok8s renders are stateless, so every render takes the
# chart's new-install defaults — each upstream default flip lands silently on
# the next bump instead of waiting behind a compatibility pin. The 1.20 bump
# accepted `envoy-xds-mode: ads` this way. During a rolling upgrade the agent
# and cilium-envoy DaemonSets roll independently, so a node can briefly pair a
# new envoy (ADS) with an old agent (per-resource xDS) and inversely on
# rollback; envoy retries, the mismatch is per-node and bounded by the
# rollout, and it degrades only L7-proxy features (this addon ships no L7
# policies). Re-check this trade on every bump: if a flip is not safe to take
# mid-rollout, pin the OLD behavior in values.yaml for one release instead of
# setting upgradeCompatibility.
repository: https://helm.cilium.io/
chart: cilium
version: 1.20.1
valueFiles:
  - values.yaml
