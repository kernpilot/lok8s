# The five rules the rook-ceph addon strips from the node plugin ClusterRole,
# verbatim from the ceph-csi-drivers chart (templates/rbd-nodeplugin-cr-rbac.yaml),
# bound to the node plugin and the controller plugin ServiceAccounts (the
# controller plugin loses four of the five; it keeps tokenreviews). Together
# with the narrowed roles the effective permissions equal the upstream
# chart's: every node that runs the plugin, and the controller pod, can read
# every Secret and mint a token for any ServiceAccount again.
# Per-feature, namespaced grants: https://github.com/kernpilot/lok8s/issues/265.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rook-ceph-csi-nodeplugin-kms-cr
rules:
  # KMS passphrase / tenant token Secrets; the rbd-nbd healer's node-stage Secret.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  # The KMS configuration ConfigMap and the per-tenant Vault config.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  # The tenant ServiceAccount (vaulttenantsa) and a TokenRequest for it.
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get]
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    verbs: [create]
  # Vault token-reviewer setup (ceph-csi docs/rbd/deploy.md).
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rook-ceph-csi-nodeplugin-kms-crb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rook-ceph-csi-nodeplugin-kms-cr
subjects:
  - kind: ServiceAccount
    name: rook-ceph-rbd-csi-ceph-com-nodeplugin-sa
    namespace: rook-ceph
  - kind: ServiceAccount
    name: rook-ceph-rbd-csi-ceph-com-ctrlplugin-sa
    namespace: rook-ceph
